<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --brown-900:#2A1810;
    --brown-800:#3C2416;
    --brown-700:#4f2c1d;
    --paper:#F5EDE1;
    --paper-line:#E4D5C0;
    --orange:#BE4D00;
    --orange-soft:#F0DCC9;
    --gold:#C9A84C;
    --gold-soft:#F3E9CE;
    --wine:#7A2E1D;
    --wine-soft:#EAD9CF;
    --ink:#2A1810;
    --ink-soft:#6B5A48;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans',sans-serif;
    background:var(--brown-900);
    color:var(--ink);
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:220px;
    background:var(--brown-900);
    padding:28px 16px;
    flex-shrink:0;
    border-right:1px solid #1c0f08;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    color:var(--gold);
    margin:0 0 4px 4px;
  }
  .brand-sub{
    font-size:11px;
    color:#a8907a;
    margin:0 0 28px 4px;
    letter-spacing:.04em;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:8px;
    color:#d9c7b3;
    font-size:14px;
    cursor:pointer;
    margin-bottom:4px;
    transition:background .15s;
  }
  .nav-item:hover{ background:#4a2c1c; }
  .nav-item.active{ background:var(--orange); color:#fff; font-weight:500; }
  .main{
    flex:1;
    background:var(--paper);
    padding:32px 40px;
    min-height:100vh;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    color:var(--brown-700);
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 28px;
  }
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 16px;
    color:var(--brown-700);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:500;
  }
  input, select{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    font-size:14px;
    font-family:'Work Sans',sans-serif;
    background:#fdfaf5;
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--orange);
  }
  .row{
    display:grid;
    gap:12px;
    margin-bottom:14px;
  }
  .row-4{ grid-template-columns:1.4fr 1fr 1fr 1fr; }
  .row-3{ grid-template-columns:1fr 1fr 1fr; }
  .row-2{ grid-template-columns:1fr 1fr; }
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:500;
    font-size:14px;
    padding:10px 18px;
    border-radius:7px;
    border:none;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover{ opacity:.88; }
  .btn-primary{ background:var(--orange); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--brown-700); border:1px solid var(--paper-line); }
  .btn-danger{ background:transparent; color:var(--wine); border:1px solid var(--wine-soft); padding:5px 10px; font-size:12px; }
  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:500;
    padding:3px 9px;
    border-radius:20px;
    letter-spacing:.02em;
  }
  .tag-receita{ background:var(--gold-soft); color:#6b5216; }
  .tag-despesa{ background:var(--wine-soft); color:var(--wine); }
  .tag-fixa{ background:#eee; color:#666; }
  .tag-variavel{ background:var(--orange-soft); color:var(--orange); }
  .ledger-row{
    display:grid;
    grid-template-columns:auto 1fr auto auto auto;
    gap:14px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px dashed var(--paper-line);
    font-size:14px;
  }
  .ledger-row:last-child{ border-bottom:none; }
  .money{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:500;
  }
  .money.pos{ color:#3B6D11; }
  .money.neg{ color:var(--wine); }
  .stamp{
    width:26px;height:26px;border-radius:50%;
    background:var(--gold-soft);
    color:#6b5216;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:11px;
    border:1px solid var(--gold);
    flex-shrink:0;
  }
  .metric-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-bottom:20px;
  }
  .metric{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .metric-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .metric-value{
    font-family:'IBM Plex Mono',monospace;
    font-size:24px;
    font-weight:500;
  }
  .metric-value.underline-double{
    border-bottom:3px double var(--brown-700);
    padding-bottom:6px;
    display:inline-block;
  }
  .person-bar-row{
    display:grid;
    grid-template-columns:120px 1fr 90px;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:13px;
  }
  .person-bar-track{
    background:var(--paper);
    border-radius:6px;
    height:16px;
    overflow:hidden;
  }
  .person-bar-fill{
    height:100%;
    background:var(--orange);
    border-radius:6px;
  }
  .upload-zone{
    border:2px dashed var(--paper-line);
    border-radius:var(--radius);
    padding:36px;
    text-align:center;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:14px;
  }
  .upload-zone:hover{ border-color:var(--orange); color:var(--orange); }
  .review-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .review-table th{
    text-align:left;
    font-weight:500;
    color:var(--ink-soft);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.03em;
    padding:6px 8px;
    border-bottom:1px solid var(--paper-line);
  }
  .review-table td{
    padding:6px 8px;
    border-bottom:1px dashed var(--paper-line);
  }
  .review-table input{ padding:6px 8px; font-size:13px; }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .loading-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--orange);
    margin-right:6px;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
  .helper{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .btn-mic{
    background:var(--gold-soft);
    color:#6b5216;
    border:1px solid var(--gold);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .btn-mic.listening{
    background:var(--wine);
    color:#fff;
    border-color:var(--wine);
  }
  .btn-mic.listening .mic-dot{
    background:#fff;
  }
  .mic-dot{
    width:8px;height:8px;border-radius:50%;
    background:#6b5216;
    animation:pulse 1s infinite;
  }
  .voice-bar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .voice-transcript{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

// Lista fixa de categorias — pra adicionar uma nova, edite aqui e faça o deploy de novo.
// Não é editável pela interface, de propósito (evita categoria duplicada/escrita diferente).
const CATEGORIAS = ["Taxi", "Alimentação", "Moradia", "Outros"];

// COLE AQUI as URLs que aparecem no terminal depois do "firebase deploy --only functions"

// COLE AQUI a configuração do app Web do Firebase
// (Project Settings → General → Your apps → SDK setup and configuration)
const firebaseConfig = {
  apiKey: "AIzaSyCozKpmHXcvxFNS5ZZJLgae0B4rTRs6Qo0",
  authDomain: "finance-c20f5.firebaseapp.com",
  projectId: "finance-c20f5",
  storageBucket: "finance-c20f5.firebasestorage.app",
  messagingSenderId: "901993488747",

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

async function garantirLogin(){
  if(!auth.currentUser){
    await auth.signInAnonymously();
  }
}

function mesRefAtual(offset=0){
  const d = new Date();
  d.setDate(1); // evita bug: dia 31 + mês sem dia 31 faz o JS pular um mês inteiro
  d.setMonth(d.getMonth()+offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
// Igual mesRefAtual, mas parte de um mês base escolhido (ex: mês de referência da fatura)
// em vez de partir sempre do mês de hoje.
function mesRefDesde(baseRef, offset=0){
  const [ano, mes] = baseRef.split("-").map(Number);
  const d = new Date(ano, (mes-1)+offset, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function mesLabel(ref){
  const [y,m] = ref.split("-");
  return `${MESES[parseInt(m,10)-1]}/${y.slice(2)}`;
}
function fmtMoney(v){
  return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function uid(){ return Math.random().toString(36).slice(2,10); }

const PALETA_CORES = ["#BE4D00","#C9A84C","#7A2E1D","#4f2c1d","#8a7350","#a86a3d"];

// Gráfico de rosca em SVG puro (sem dependência externa), recebe [{label, value}]
function DonutChart({data, size=150}){
  const dadosValidos = data.filter(d => d.value > 0);
  const total = dadosValidos.reduce((s,d)=>s+d.value,0);
  const radius = 52;
  const stroke = 22;
  const circumference = 2 * Math.PI * radius;
  let acumulado = 0;

  return (
    <svg viewBox="0 0 150 150" width={size} height={size}>
      <g transform="translate(75,75) rotate(-90)">
        {total === 0 && (
          <circle r={radius} fill="none" stroke="var(--paper-line)" strokeWidth={stroke} />
        )}
        {total > 0 && dadosValidos.map((d, i) => {
          const fracao = d.value / total;
          const dash = fracao * circumference;
          const offset = -acumulado * circumference;
          acumulado += fracao;
          const percentual = (fracao*100).toFixed(1);
          return (
            <circle
              key={i}
              r={radius}
              fill="none"
              stroke={d.color || PALETA_CORES[i % PALETA_CORES.length]}
              strokeWidth={stroke}
              strokeDasharray={`${dash} ${circumference - dash}`}
              strokeDashoffset={offset}
              style={{cursor:"pointer"}}
            >
              <title>{`${d.label}: ${fmtMoney(d.value)} (${percentual}%)`}</title>
            </circle>
          );
        })}
      </g>
      <text x="75" y="70" textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" fontSize="15" fontWeight="500" fill="var(--brown-700)">
        {fmtMoney(total)}
      </text>
      <text x="75" y="88" textAnchor="middle" fontFamily="'Work Sans',sans-serif" fontSize="10" fill="var(--ink-soft)">
        total
      </text>
    </svg>
  );
}

// Gráfico de linha em SVG puro, recebe [{label, value}] em ordem cronológica
function LineChart({data, height=170}){
  const width = 640;
  const padding = 44;
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const stepX = data.length>1 ? (width - padding*2) / (data.length-1) : 0;
  const pontos = data.map((d,i)=>{
    const x = padding + i*stepX;
    const y = height - padding - (d.value/maxVal) * (height - padding*2);
    return { ...d, x, y };
  });
  const linhaD = pontos.map((p,i)=> `${i===0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
  const areaD = pontos.length>0
    ? `${linhaD} L ${pontos[pontos.length-1].x} ${height-padding} L ${pontos[0].x} ${height-padding} Z`
    : "";

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{maxWidth:640}}>
      <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="var(--paper-line)" strokeWidth="1" />
      {pontos.length>0 && <path d={areaD} fill="var(--orange-soft)" opacity="0.5" />}
      {pontos.length>0 && <path d={linhaD} fill="none" stroke="var(--orange)" strokeWidth="2.5" />}
      {pontos.map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4.5" fill="var(--orange)" stroke="#fff" strokeWidth="1.5" style={{cursor:"pointer"}}>
            <title>{`${p.label}: ${fmtMoney(p.value)}`}</title>
          </circle>
          <text x={p.x} y={height-padding+18} textAnchor="middle" fontSize="11" fontFamily="'Work Sans',sans-serif" fill="var(--ink-soft)">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}



// Aplica as regras de categoria automática: procura a primeira regra cuja palavra-chave
// aparece na descrição (sem diferenciar maiúsculas/minúsculas/acentos) e devolve a categoria.
function categorizarAutomatico(descricao, regras){
  if(!descricao || !regras || regras.length===0) return null;
  const normalizar = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const descNorm = normalizar(descricao);
  const regra = regras.find(r => descNorm.includes(normalizar(r.palavraChave)));
  return regra ? regra.categoria : null;
}

async function loadData(){
  try{
    await garantirLogin();
    const doc = await db.collection("financeiro").doc("dados").get();
    if(doc.exists){
      const parsed = doc.data();
      return { lancamentos: [], comprasCartao: [], categoriaRegras: [], ...parsed };
    }
  }catch(e){
    console.error("Erro ao carregar dados do Firestore:", e);
    throw e;
  }
  return { lancamentos: [], comprasCartao: [], categoriaRegras: [] };
}
async function saveData(data){
  await garantirLogin();
  await db.collection("financeiro").doc("dados").set(data);
}

function App(){
  const [view, setView] = useState("lancamentos");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [erroCarregamento, setErroCarregamento] = useState(null);
  const [erroSalvamento, setErroSalvamento] = useState(null);
  const [atualizando, setAtualizando] = useState(false);

  useEffect(()=>{
    loadData()
      .then(d=>{ setData(d); setLoading(false); })
      .catch(e=>{
        console.error("Falha ao carregar dados:", e);
        setErroCarregamento("Não consegui conectar ao banco de dados. Verifique a configuração do Firebase no topo do código, ou tente recarregar a página.");
        setLoading(false);
      });
  },[]);

  async function atualizarDados(){
    setAtualizando(true);
    try{
      const d = await loadData();
      setData(d);
    }catch(e){
      console.error("Falha ao atualizar dados:", e);
      setErroSalvamento("Não consegui buscar os dados mais recentes. Verifique sua internet.");
    }finally{
      setAtualizando(false);
    }
  }

  async function updateData(next){
    setData(next);
    setErroSalvamento(null);
    try{
      await saveData(next);
    }catch(e){
      console.error("Falha ao salvar dados:", e);
      setErroSalvamento("Não consegui salvar essa alteração. Verifique sua internet e tente de novo — se persistir, os dados podem não estar sendo guardados.");
    }
  }

  if(loading){
    return <div style={{padding:"40px",color:"#8a7a68",fontFamily:"'Work Sans',sans-serif"}}>
      <span className="loading-dot"></span>Carregando...
    </div>;
  }

  if(erroCarregamento){
    return <div style={{padding:"40px",color:"var(--wine)",fontFamily:"'Work Sans',sans-serif",maxWidth:500}}>
      {erroCarregamento}
    </div>;
  }

  return (
    <div className="app">
      <div className="sidebar">
        <p className="brand">Gestão Financeira</p>
        <div className={`nav-item ${view==="lancamentos"?"active":""}`} onClick={()=>setView("lancamentos")}>Lançamentos</div>
        <div className={`nav-item ${view==="cartao"?"active":""}`} onClick={()=>setView("cartao")}>Cartão de crédito</div>
        <div className={`nav-item ${view==="dashboard"?"active":""}`} onClick={()=>setView("dashboard")}>Dashboard</div>
        <button
          className="btn-ghost"
          style={{width:"100%", marginTop:16, color:"#d9c7b3", borderColor:"#4a2c1c"}}
          onClick={atualizarDados}
          disabled={atualizando}
        >
          {atualizando ? "Atualizando..." : "↻ Atualizar dados"}
        </button>
      </div>
      <div className="main">
        {erroSalvamento && (
          <div style={{background:"var(--wine-soft)", border:"1px solid var(--wine)", color:"var(--wine)", borderRadius:8, padding:"10px 14px", fontSize:13, marginBottom:16}}>
            {erroSalvamento}
          </div>
        )}
        {view==="lancamentos" && <Lancamentos data={data} updateData={updateData} />}
        {view==="cartao" && <Cartao data={data} updateData={updateData} />}
        {view==="dashboard" && <Dashboard data={data} />}
      </div>
    </div>
  );
}

function Categorias({data, updateData}){
  const [palavraChave, setPalavraChave] = useState("");
  const [categoria, setCategoria] = useState("");

  function addRegra(){
    if(!palavraChave || !categoria) return;
    const nova = { id: uid(), palavraChave: palavraChave.trim(), categoria: categoria.trim() };
    updateData({ ...data, categoriaRegras: [...(data.categoriaRegras||[]), nova] });
    setPalavraChave(""); setCategoria("");
  }
  function remover(id){
    updateData({ ...data, categoriaRegras: (data.categoriaRegras||[]).filter(r=>r.id!==id) });
  }

  const regras = data.categoriaRegras || [];

  return (
    <div>
      <h1>Categorias automáticas</h1>
      <p className="subtitle">Configure palavras-chave: sempre que aparecerem na descrição de um lançamento (manual, por voz ou de fatura), a categoria é preenchida sozinha.</p>

      <div className="card">
        <h2>Nova regra</h2>
        <div className="row row-3">
          <div>
            <label>Palavra-chave (aparece na descrição)</label>
            <input value={palavraChave} onChange={e=>setPalavraChave(e.target.value)} placeholder="ex: uber, 99, ifood" />
          </div>
          <div>
            <label>Categoria a aplicar</label>
            <select value={categoria} onChange={e=>setCategoria(e.target.value)}>
              <option value="">Selecione...</option>
              {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{display:"flex", alignItems:"flex-end"}}>
            <button className="btn-primary" onClick={addRegra} style={{width:"100%"}}>Adicionar regra</button>
          </div>
        </div>
        <p className="helper">Não diferencia maiúsculas/minúsculas nem acentos. A primeira regra que combinar com a descrição é usada.</p>
      </div>

      <div className="card">
        <h2>Regras cadastradas</h2>
        {regras.length===0 && <div className="empty-state">Nenhuma regra ainda. Cadastre a primeira acima — ex: "uber" → "Transporte".</div>}
        {regras.map(r=>(
          <div className="ledger-row" key={r.id} style={{gridTemplateColumns:"auto 1fr auto"}}>
            <span className="tag tag-variavel">se contém "{r.palavraChave}"</span>
            <span style={{fontWeight:500}}>→ {r.categoria}</span>
            <button className="btn-danger" onClick={()=>remover(r.id)}>Remover</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function Lancamentos({data, updateData}){
  const [tipo, setTipo] = useState("receita");
  const [natureza, setNatureza] = useState("fixa");
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [categoria, setCategoria] = useState("");
  const [mesRef, setMesRef] = useState(mesRefAtual());
  const [listening, setListening] = useState(false);
  const [processingVoice, setProcessingVoice] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [voiceError, setVoiceError] = useState(null);
  const [voiceFilled, setVoiceFilled] = useState(false);
  const [erroValidacao, setErroValidacao] = useState(null);
  const recognitionRef = useRef(null);

  async function parseVoiceText(texto){
    setProcessingVoice(true);
    setVoiceError(null);
    if(URL_PARSE_VOZ.startsWith("COLE_AQUI")){
      setVoiceError("As URLs da Cloud Function ainda não foram preenchidas no código (topo do arquivo).");
      setProcessingVoice(false);
      return;
    }
    try{
      const response = await fetch(URL_PARSE_VOZ, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto })
      });
      const json = await response.json();
      if(!response.ok || json.error){
        throw new Error(json.error || "Erro ao interpretar o áudio");
      }
      const parsed = json.lancamento;
      if(parsed.tipo) setTipo(parsed.tipo);
      if(parsed.natureza) setNatureza(parsed.natureza);
      if(parsed.descricao) setDescricao(parsed.descricao);
      if(parsed.valor) setValor(String(parsed.valor));
      const regraCategoria = categorizarAutomatico(parsed.descricao, data.categoriaRegras);
      if(regraCategoria) setCategoria(regraCategoria);
      else if(parsed.categoria) setCategoria(parsed.categoria);
      setVoiceFilled(true);
    }catch(e){
      console.error("Erro ao interpretar voz:", e);
      setVoiceError("Não consegui interpretar o áudio automaticamente. Confira e preencha os campos abaixo manualmente antes de adicionar.");
    }finally{
      setProcessingVoice(false);
    }
  }

  function toggleVoice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      setVoiceError("Comando por voz não é suportado neste navegador. Tente no Chrome.");
      return;
    }
    if(listening && recognitionRef.current){
      recognitionRef.current.stop();
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "pt-BR";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { setListening(true); setTranscript(""); setVoiceError(null); setVoiceFilled(false); };
    recognition.onresult = (event) => {
      const texto = event.results[0][0].transcript;
      setTranscript(texto);
      parseVoiceText(texto);
    };
    recognition.onerror = () => { setVoiceError("Não consegui captar o áudio. Verifique a permissão do microfone."); setListening(false); };
    recognition.onend = () => setListening(false);
    recognitionRef.current = recognition;
    recognition.start();
  }

  function addLancamento(){
    if(!descricao || !valor){
      const faltando = [];
      if(!descricao) faltando.push("Descrição");
      if(!valor) faltando.push("Valor");
      setErroValidacao(`Preencha antes de adicionar: ${faltando.join(" e ")}.`);
      return;
    }
    setErroValidacao(null);
    const novo = {
      id: uid(),
      tipo, natureza, descricao,
      valor: parseFloat(valor),
      categoria: categoria || "Outros",
      mes_referencia: mesRef,
    };
    const next = { ...data, lancamentos: [novo, ...data.lancamentos] };
    updateData(next);
    setDescricao(""); setValor(""); setCategoria(""); setVoiceFilled(false); setTranscript("");
  }
  function remover(id){
    updateData({ ...data, lancamentos: data.lancamentos.filter(l=>l.id!==id) });
  }

  const ordenados = [...data.lancamentos].sort((a,b)=> b.mes_referencia.localeCompare(a.mes_referencia));

  return (
    <div>
      <h1>Lançamentos</h1>
      <p className="subtitle">Receitas e despesas, fixas ou variáveis.</p>

      <div className="card">
        <h2>Novo lançamento</h2>
        <div className="voice-bar">
          <button
            type="button"
            className={`btn-mic ${listening ? "listening" : ""}`}
            onClick={toggleVoice}
          >
            <span className="mic-dot"></span>
            {listening ? "Ouvindo... toque para parar" : processingVoice ? "Interpretando..." : "Adicionar por voz"}
          </button>
          {transcript && <span className="voice-transcript">"{transcript}"</span>}
        </div>
        {voiceError && <p className="helper" style={{color:"var(--wine)", marginTop:-8, marginBottom:14}}>{voiceError}</p>}
        {voiceFilled && (
          <div style={{background:"var(--gold-soft)", border:"1px solid var(--gold)", borderRadius:8, padding:"8px 12px", fontSize:13, color:"#6b5216", marginBottom:14}}>
            Preenchi os campos abaixo com base no que você falou. Confira tipo, valor e descrição antes de clicar em "Adicionar lançamento".
          </div>
        )}
        <div className="row row-4">
          <div>
            <label>Tipo</label>
            <select value={tipo} onChange={e=>setTipo(e.target.value)}>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>
          <div>
            <label>Natureza</label>
            <select value={natureza} onChange={e=>setNatureza(e.target.value)}>
              <option value="fixa">Fixa</option>
              <option value="variavel">Variável</option>
            </select>
          </div>
          <div>
            <label>Categoria</label>
            <select value={categoria} onChange={e=>setCategoria(e.target.value)}>
              <option value="">Selecione...</option>
              {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>Mês de referência</label>
            <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} />
          </div>
        </div>
        <div className="row row-2">
          <div>
            <label>Descrição</label>
            <input
              value={descricao}
              onChange={e=>setDescricao(e.target.value)}
              onBlur={()=>{
                if(!categoria){
                  const regraCategoria = categorizarAutomatico(descricao, data.categoriaRegras);
                  if(regraCategoria) setCategoria(regraCategoria);
                }
              }}
              placeholder="ex: consultoria cliente X, uber, ifood"
            />
          </div>
          <div>
            <label>Valor (R$)</label>
            <input type="number" step="0.01" value={valor} onChange={e=>setValor(e.target.value)} placeholder="0,00" />
          </div>
        </div>
        <button className="btn-primary" onClick={addLancamento}>Adicionar lançamento</button>
        {erroValidacao && <p className="helper" style={{color:"var(--wine)", marginTop:8}}>{erroValidacao}</p>}
      </div>

      <div className="card">
        <h2>Histórico</h2>
        {ordenados.length===0 && <div className="empty-state">Nenhum lançamento ainda. Adicione o primeiro acima.</div>}
        {ordenados.map(l=>(
          <div className="ledger-row" key={l.id}>
            <span className={`tag ${l.tipo==="receita"?"tag-receita":"tag-despesa"}`}>{l.tipo}</span>
            <div>
              <div style={{fontWeight:500}}>{l.descricao}</div>
              <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                {l.categoria} · <span className={`tag ${l.natureza==="fixa"?"tag-fixa":"tag-variavel"}`}>{l.natureza}</span> · {mesLabel(l.mes_referencia)}
              </div>
            </div>
            <span className={`money ${l.tipo==="receita"?"pos":"neg"}`}>{l.tipo==="receita"?"+":"-"}{fmtMoney(l.valor)}</span>
            <span></span>
            <button className="btn-danger" onClick={()=>remover(l.id)}>Remover</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function Cartao({data, updateData}){
  const [imageBase64, setImageBase64] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [reviewItems, setReviewItems] = useState(null);
  const [error, setError] = useState(null);
  const [mesPagamentoFatura, setMesPagamentoFatura] = useState(mesRefAtual());
  const [editandoId, setEditandoId] = useState(null);
  const [edicaoTemp, setEdicaoTemp] = useState(null);
  const fileRef = useRef(null);

  function iniciarEdicao(c){
    setEditandoId(c.id);
    setEdicaoTemp({ descricao: c.descricao, valor_parcela: c.valor_parcela, responsavel: c.responsavel });
  }
  function salvarEdicao(id){
    updateData({
      ...data,
      comprasCartao: data.comprasCartao.map(x => x.id===id
        ? { ...x, descricao: edicaoTemp.descricao, valor_parcela: parseFloat(edicaoTemp.valor_parcela), responsavel: edicaoTemp.responsavel }
        : x
      )
    });
    setEditandoId(null);
    setEdicaoTemp(null);
  }
  function cancelarEdicao(){
    setEditandoId(null);
    setEdicaoTemp(null);
  }

  function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(",")[1];
      setImageBase64({ data: base64, mediaType: file.type });
      runOcr(base64, file.type);
    };
    reader.readAsDataURL(file);
  }

  async function runOcr(base64, mediaType){
    setProcessing(true);
    setError(null);
    if(URL_PARSE_FATURA.startsWith("COLE_AQUI")){
      setError("As URLs da Cloud Function ainda não foram preenchidas no código (topo do arquivo).");
      setProcessing(false);
      return;
    }
    try{
      const response = await fetch(URL_PARSE_FATURA, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mediaType })
      });
      const json = await response.json();
      if(!response.ok || json.error){
        throw new Error(json.error || "Erro ao processar a fatura");
      }
      const parsed = json.itens;
      setReviewItems(parsed.map(item => ({
        id: uid(),
        descricao: item.descricao || "",
        valor_parcela: item.valor_parcela || 0,
        parcela_atual: item.parcela_atual || 1,
        parcela_total: item.parcela_total || 1,
        responsavel: "",
        categoria: categorizarAutomatico(item.descricao, data.categoriaRegras) || "Outros",
      })));
    }catch(e){
      console.error("Erro ao ler fatura:", e);
      setError("Não consegui ler a fatura. Tente uma foto mais nítida ou lance manualmente.");
    }finally{
      setProcessing(false);
    }
  }

  function updateItem(id, field, value){
    setReviewItems(items => items.map(it => it.id===id ? {...it, [field]: value} : it));
  }
  function removeItem(id){
    setReviewItems(items => items.filter(it => it.id!==id));
  }

  function confirmarImportacao(){
    const novasCompras = [];
    const origemBase = uid();
    reviewItems.forEach(item => {
      const restantes = Math.max(1, item.parcela_total - item.parcela_atual + 1);
      for(let i=0; i<restantes; i++){
        novasCompras.push({
          id: uid(),
          compra_origem_id: origemBase + "-" + item.id,
          descricao: item.descricao,
          valor_parcela: parseFloat(item.valor_parcela),
          parcela_atual: item.parcela_atual + i,
          parcela_total: item.parcela_total,
          responsavel: item.responsavel || "não informado",
          categoria: item.categoria,
          mes_referencia: mesRefDesde(mesPagamentoFatura, i),
        });
      }
    });
    updateData({ ...data, comprasCartao: [...novasCompras, ...data.comprasCartao] });
    setReviewItems(null);
    setImageBase64(null);
    if(fileRef.current) fileRef.current.value = "";
  }

  const comprasOrdenadas = [...data.comprasCartao].sort((a,b)=> b.mes_referencia.localeCompare(a.mes_referencia));

  return (
    <div>
      <h1>Cartão de crédito</h1>
      <p className="subtitle">Suba o print ou o PDF da fatura. O sistema lê as compras, projeta as parcelas futuras e deixa você marcar quem fez cada compra.</p>

      {!reviewItems && (
        <div className="card">
          <h2>Importar fatura</h2>
          <div className="row row-2" style={{marginBottom:16}}>
            <div>
              <label>Mês em que essa fatura é paga</label>
              <input type="month" value={mesPagamentoFatura} onChange={e=>setMesPagamentoFatura(e.target.value)} />
              <p className="helper" style={{marginTop:4}}>O mês em que a fatura é efetivamente paga/cobrada (não o mês de fechamento). Ex: fatura fechada em junho mas paga em julho → escolha julho aqui. As parcelas futuras são contadas a partir desse mês.</p>
            </div>
          </div>
          <div className="upload-zone" onClick={()=>fileRef.current.click()}>
            {processing ? <span><span className="loading-dot"></span>Lendo a fatura...</span> : "Clique para enviar o print ou o PDF da fatura"}
          </div>
          <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={handleFile} />
          {error && <p className="helper" style={{color:"var(--wine)"}}>{error}</p>}
        </div>
      )}

      {reviewItems && (
        <div className="card">
          <h2>Confira antes de importar</h2>
          <p className="helper" style={{marginBottom:14}}>Ajuste valores se o OCR errar algo e marque quem fez cada compra. Créditos, estornos ou pagamentos recebidos devem ter valor negativo (ex: -150.00) — eles abatem do total automaticamente.</p>
          <table className="review-table">
            <thead>
              <tr><th>Descrição</th><th>Valor parcela</th><th>Parcela</th><th>Total parcelas</th><th>Quem comprou</th><th></th></tr>
            </thead>
            <tbody>
              {reviewItems.map(item=>(
                <tr key={item.id}>
                  <td><input value={item.descricao} onChange={e=>updateItem(item.id,"descricao",e.target.value)} /></td>
                  <td><input type="number" step="0.01" style={{width:90}} value={item.valor_parcela} onChange={e=>updateItem(item.id,"valor_parcela",e.target.value)} /></td>
                  <td><input type="number" style={{width:60}} value={item.parcela_atual} onChange={e=>updateItem(item.id,"parcela_atual",parseInt(e.target.value)||1)} /></td>
                  <td><input type="number" style={{width:60}} value={item.parcela_total} onChange={e=>updateItem(item.id,"parcela_total",parseInt(e.target.value)||1)} /></td>
                  <td><input value={item.responsavel} onChange={e=>updateItem(item.id,"responsavel",e.target.value)} placeholder="ex: Eu, Marido" /></td>
                  <td><button className="btn-danger" onClick={()=>removeItem(item.id)}>Remover</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{marginTop:18,display:"flex",gap:10}}>
            <button className="btn-primary" onClick={confirmarImportacao}>Confirmar e projetar parcelas futuras</button>
            <button className="btn-ghost" onClick={()=>{setReviewItems(null); setImageBase64(null);}}>Cancelar</button>
          </div>
        </div>
      )}

      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
          <h2 style={{marginBottom:0}}>Compras registradas</h2>
          {comprasOrdenadas.length>0 && (
            <button
              className="btn-danger"
              onClick={()=>{
                if(window.confirm(`Isso vai apagar TODAS as ${data.comprasCartao.length} linhas de cartão importadas (todas as faturas, todos os meses). Não dá pra desfazer. Confirma?`)){
                  updateData({ ...data, comprasCartao: [] });
                }
              }}
            >
              Limpar tudo
            </button>
          )}
        </div>
        {comprasOrdenadas.length===0 && <div className="empty-state">Nenhuma compra de cartão importada ainda.</div>}
        {comprasOrdenadas.map(c=>{
          if(editandoId === c.id){
            return (
              <div key={c.id} style={{padding:"12px 0", borderBottom:"1px dashed var(--paper-line)"}}>
                <div className="row row-3" style={{marginBottom:10}}>
                  <div>
                    <label>Descrição</label>
                    <input value={edicaoTemp.descricao} onChange={e=>setEdicaoTemp({...edicaoTemp, descricao:e.target.value})} />
                  </div>
                  <div>
                    <label>Valor da parcela</label>
                    <input type="number" step="0.01" value={edicaoTemp.valor_parcela} onChange={e=>setEdicaoTemp({...edicaoTemp, valor_parcela:e.target.value})} />
                  </div>
                  <div>
                    <label>Quem comprou</label>
                    <input value={edicaoTemp.responsavel} onChange={e=>setEdicaoTemp({...edicaoTemp, responsavel:e.target.value})} placeholder="ex: Eu, Marido" />
                  </div>
                </div>
                <div style={{display:"flex", gap:8}}>
                  <button className="btn-primary" onClick={()=>salvarEdicao(c.id)}>Salvar</button>
                  <button className="btn-ghost" onClick={cancelarEdicao}>Cancelar</button>
                </div>
              </div>
            );
          }
          return (
            <div className="ledger-row" key={c.id}>
              <div className="stamp">{(c.responsavel||"?").slice(0,2).toUpperCase()}</div>
              <div>
                <div style={{fontWeight:500}}>{c.descricao}</div>
                <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                  parcela {c.parcela_atual}/{c.parcela_total} · {c.responsavel} · {mesLabel(c.mes_referencia)}
                </div>
              </div>
              <span className={`money ${(-c.valor_parcela)<0 ? "neg" : "pos"}`}>
                {(-c.valor_parcela)>=0 ? "+" : ""}{fmtMoney(-c.valor_parcela)}
              </span>
              <button className="btn-ghost" onClick={()=>iniciarEdicao(c)}>Editar</button>
              <button
                className="btn-danger"
                onClick={()=>updateData({ ...data, comprasCartao: data.comprasCartao.filter(x=>x.id!==c.id) })}
              >
                Remover
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({data}){
  const [mesFiltro, setMesFiltro] = useState(mesRefAtual());
  const [mesDetalhe, setMesDetalhe] = useState(null);
  const lancamentosMes = data.lancamentos.filter(l=>l.mes_referencia===mesFiltro);
  const comprasMes = data.comprasCartao.filter(c=>c.mes_referencia===mesFiltro);

  const receitas = lancamentosMes.filter(l=>l.tipo==="receita").reduce((s,l)=>s+l.valor,0);
  const despesasDiretas = lancamentosMes.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+l.valor,0);
  const despesaCartao = comprasMes.reduce((s,c)=>s+c.valor_parcela,0);
  const despesasTotal = despesasDiretas + despesaCartao;
  const saldo = receitas - despesasTotal;

  // Gasto por pessoa (cartão) — só considera compras de verdade (valor positivo);
  // créditos/estornos não são "gasto de alguém", então ficam de fora daqui.
  const porPessoa = {};
  comprasMes.filter(c=>c.valor_parcela > 0).forEach(c=>{
    porPessoa[c.responsavel] = (porPessoa[c.responsavel]||0) + c.valor_parcela;
  });
  const dadosPessoa = Object.entries(porPessoa)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({ label, value, color: PALETA_CORES[i % PALETA_CORES.length] }));
  const creditosMes = comprasMes.filter(c=>c.valor_parcela < 0).reduce((s,c)=>s+c.valor_parcela,0);

  // Gasto por categoria (despesas diretas + cartão, mês atual)
  const porCategoria = {};
  lancamentosMes.filter(l=>l.tipo==="despesa").forEach(l=>{
    porCategoria[l.categoria||"Outros"] = (porCategoria[l.categoria||"Outros"]||0) + l.valor;
  });
  comprasMes.forEach(c=>{
    porCategoria["Cartão de crédito"] = (porCategoria["Cartão de crédito"]||0) + c.valor_parcela;
  });
  const dadosCategoria = Object.entries(porCategoria)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({ label, value, color: PALETA_CORES[i % PALETA_CORES.length] }));

  // Previsão de despesa do cartão — olha os próximos 6 meses
  const todosProximosMeses = [1,2,3,4,5,6].map(offset=>{
    const ref = mesRefAtual(offset);
    const total = data.comprasCartao.filter(c=>c.mes_referencia===ref).reduce((s,c)=>s+c.valor_parcela,0);
    return { ref, total };
  });
  const proximosMeses = todosProximosMeses.filter(m => m.total > 0);

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexWrap:"wrap", gap:12}}>
        <div>
          <h1>Dashboard — {mesLabel(mesFiltro)}</h1>
          <p className="subtitle">Visão consolidada: lançamentos diretos + cartão de crédito, tudo no mesmo lugar.</p>
        </div>
        <div style={{marginBottom:24}}>
          <label>Ver mês</label>
          <input type="month" value={mesFiltro} onChange={e=>setMesFiltro(e.target.value)} />
        </div>
      </div>

      <div className="metric-grid">
        <div className="metric">
          <div className="metric-label">Receitas do mês</div>
          <div className="metric-value" style={{color:"#3B6D11"}}>{fmtMoney(receitas)}</div>
        </div>
        <div className="metric">
          <div className="metric-label">Despesas do mês (direta + cartão)</div>
          <div className="metric-value" style={{color:"var(--wine)"}}>{fmtMoney(despesasTotal)}</div>
        </div>
        <div className="metric">
          <div className="metric-label">Saldo</div>
          <div className={`metric-value underline-double`} style={{color: saldo>=0 ? "#3B6D11" : "var(--wine)"}}>{fmtMoney(saldo)}</div>
        </div>
      </div>

      <div style={{display:"flex", gap:20, flexWrap:"wrap"}}>
        <div className="card" style={{flex:1, minWidth:280}}>
          <h2>Gasto por categoria — {mesLabel(mesFiltro)}</h2>
          {dadosCategoria.length===0 && <div className="empty-state">Nenhuma despesa neste mês ainda.</div>}
          {dadosCategoria.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14}}>
              <DonutChart data={dadosCategoria} />
              <div style={{display:"flex", flexWrap:"wrap", gap:10, justifyContent:"center"}}>
                {dadosCategoria.map(d=>(
                  <span key={d.label} title={fmtMoney(d.value)} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"default"}}>
                    <span style={{width:10,height:10,borderRadius:3,background:d.color,display:"inline-block"}}></span>
                    {d.label}
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>

        <div className="card" style={{flex:1, minWidth:280}}>
          <h2>Gasto no cartão por pessoa — {mesLabel(mesFiltro)}</h2>
          {dadosPessoa.length===0 && <div className="empty-state">Nenhuma compra de cartão neste mês.</div>}
          {dadosPessoa.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14}}>
              <DonutChart data={dadosPessoa} />
              <div style={{display:"flex", flexWrap:"wrap", gap:10, justifyContent:"center"}}>
                {dadosPessoa.map(d=>(
                  <span key={d.label} title={fmtMoney(d.value)} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"default"}}>
                    <span style={{width:10,height:10,borderRadius:3,background:d.color,display:"inline-block"}}></span>
                    {d.label}
                  </span>
                ))}
              </div>
            </div>
          )}
          {creditosMes < 0 && (
            <p className="helper" style={{marginTop:14, color:"#3B6D11"}}>
              + créditos/estornos aplicados este mês: {fmtMoney(-creditosMes)} (não atribuídos a uma pessoa)
            </p>
          )}
        </div>
      </div>

      <div className="card">
        <h2>Previsão de despesa do cartão — próximos meses</h2>
        <p className="helper" style={{marginBottom:14}}>Gerada automaticamente a partir das parcelas futuras já lançadas.</p>
        {todosProximosMeses.some(m=>m.total>0) && (
          <div style={{marginBottom:20, display:"flex", justifyContent:"center"}}>
            <LineChart data={todosProximosMeses.map(m=>({ label: mesLabel(m.ref), value: m.total }))} />
          </div>
        )}
        <p className="helper" style={{marginBottom:14}}>Clique num mês pra ver o detalhe.</p>
        {proximosMeses.length===0 && <div className="empty-state">Nenhuma despesa futura de cartão prevista nos próximos meses.</div>}
        {proximosMeses.map(m=>{
          const aberto = mesDetalhe === m.ref;
          const comprasDoMes = aberto
            ? data.comprasCartao.filter(c => c.mes_referencia === m.ref).sort((a,b) => b.valor_parcela - a.valor_parcela)
            : [];
          return (
            <React.Fragment key={m.ref}>
              <div
                className="ledger-row"
                style={{gridTemplateColumns:"1fr auto", cursor:"pointer", background: aberto ? "var(--paper)" : "transparent"}}
                onClick={()=>setMesDetalhe(aberto ? null : m.ref)}
              >
                <span style={{fontWeight: aberto ? 600 : 400}}>
                  {mesLabel(m.ref)} {aberto ? "▾" : "▸"}
                </span>
                <span className="money neg">{fmtMoney(m.total)}</span>
              </div>
              {aberto && (
                <div style={{marginBottom:14, paddingBottom:14, borderBottom:"1px dashed var(--paper-line)", background:"var(--paper)", padding:"10px 14px", borderRadius:8}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>
                    Compras previstas para {mesLabel(m.ref)}:
                  </p>
                  {comprasDoMes.length===0 && <div className="empty-state">Nenhuma compra prevista para esse mês.</div>}
                  {comprasDoMes.map(c=>(
                    <div className="ledger-row" key={c.id}>
                      <div className="stamp">{(c.responsavel||"?").slice(0,2).toUpperCase()}</div>
                      <div>
                        <div style={{fontWeight:500}}>{c.descricao}</div>
                        <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                          parcela {c.parcela_atual}/{c.parcela_total} · {c.responsavel}
                        </div>
                      </div>
                      <span className={`money ${(-c.valor_parcela)<0 ? "neg" : "pos"}`}>
                        {(-c.valor_parcela)>=0 ? "+" : ""}{fmtMoney(-c.valor_parcela)}
                      </span>
                      <span></span>
                      <span></span>
                    </div>
                  ))}
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
