<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --brown-900:#2A1810;
    --brown-800:#3C2416;
    --brown-700:#4f2c1d;
    --paper:#F5EDE1;
    --paper-line:#E4D5C0;
    --orange:#BE4D00;
    --orange-soft:#F0DCC9;
    --gold:#C9A84C;
    --gold-soft:#F3E9CE;
    --wine:#7A2E1D;
    --wine-soft:#EAD9CF;
    --ink:#2A1810;
    --ink-soft:#6B5A48;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans',sans-serif;
    background:var(--brown-900);
    color:var(--ink);
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  .sidebar{
    width:220px;
    background:var(--brown-900);
    padding:28px 16px;
    flex-shrink:0;
    border-right:1px solid #1c0f08;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-size:20px;
    font-weight:600;
    color:var(--gold);
    margin:0 0 4px 4px;
  }
  .brand-sub{
    font-size:11px;
    color:#a8907a;
    margin:0 0 28px 4px;
    letter-spacing:.04em;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    border-radius:8px;
    color:#d9c7b3;
    font-size:14px;
    cursor:pointer;
    margin-bottom:4px;
    transition:background .15s;
  }
  .nav-item:hover{ background:#4a2c1c; }
  .nav-item.active{ background:var(--orange); color:#fff; font-weight:500; }
  .main{
    flex:1;
    background:var(--paper);
    padding:32px 40px;
    min-height:100vh;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 6px;
    color:var(--brown-700);
  }
  .subtitle{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 28px;
  }
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    margin:0 0 16px;
    color:var(--brown-700);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;

    width:100%;

    border-color:var(--orange);
  }

    margin-bottom:14px;

  .row-4{ grid-template-columns:1.4fr 1fr 1fr 1fr; }
  .row-3{ grid-template-columns:1fr 1fr 1fr; }
  .row-2{ grid-template-columns:1fr 1fr; }
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:500;
    font-size:14px;
    padding:10px 18px;
    border-radius:7px;
    border:none;
    cursor:pointer;

  .btn-ghost{ background:transparent; color:var(--brown-700); border:1px solid var(--paper-line); }

    font-weight:500;

  .tag-vencido{ background:var(--wine-soft); color:var(--wine); }

    padding:12px 0;

    font-size:11px;

    font-weight:500;
    color:var(--ink-soft);
    font-size:11px;
    text-transform:uppercase;

  .empty-state{

    color:var(--ink-soft);
    font-size:14px;

  .loading-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--orange);
    margin-right:6px;

    color:#6b5216;
    border:1px solid var(--gold);

    background:var(--wine);
    color:#fff;
    border-color:var(--wine);

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];

// Lista fixa de categorias — pra adicionar uma nova, edite aqui e faça o deploy de novo.
// Não é editável pela interface, de propósito (evita categoria duplicada/escrita diferente).
const CATEGORIAS = ["Taxi", "Alimentação", "Moradia", "Salário", "Outros"];
const FORMAS_PAGAMENTO = ["Pix", "Débito", "Crédito", "Dinheiro"];

// Agrupa descrições parecidas sob um nome único no relatório "Gasto por estabelecimento".
// Pra adicionar uma regra nova, edite aqui e faça o deploy de novo.
const APELIDOS_ESTABELECIMENTO = [
  { termos: ["99*", "99app", "uber"], nome: "Táxi" },
];
function normalizarEstabelecimento(descricao){
  const desc = (descricao || "").toLowerCase();
  const regra = APELIDOS_ESTABELECIMENTO.find(r => r.termos.some(t => desc.includes(t.toLowerCase())));
  return regra ? regra.nome : (descricao || "Sem descrição").trim();
}

// COLE AQUI as URLs que aparecem no terminal depois do "firebase deploy --only functions"
// Elas vão ter o formato: https://southamerica-east1-SEU-PROJETO.cloudfunctions.net/parseFatura
const URL_PARSE_FATURA = "https://southamerica-east1-finance-c20f5.cloudfunctions.net/parseFatura";
const URL_PARSE_VOZ = "https://southamerica-east1-finance-c20f5.cloudfunctions.net/parseVoz";

// COLE AQUI a configuração do app Web do Firebase
// (Project Settings → General → Your apps → SDK setup and configuration)
const firebaseConfig = {
  apiKey: "AIzaSyCozKpmHXcvxFNS5ZZJLgae0B4rTRs6Qo0",
  authDomain: "finance-c20f5.firebaseapp.com",
  projectId: "finance-c20f5",
  storageBucket: "finance-c20f5.firebasestorage.app",

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

async function garantirLogin(){
  if(!auth.currentUser){
    await auth.signInAnonymously();
  }
}

function mesRefAtual(offset=0){
  const d = new Date();
  d.setDate(1); // evita bug: dia 31 + mês sem dia 31 faz o JS pular um mês inteiro
  d.setMonth(d.getMonth()+offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
// Igual mesRefAtual, mas parte de um mês base escolhido (ex: mês de referência da fatura)
// em vez de partir sempre do mês de hoje.
function mesRefDesde(baseRef, offset=0){
  const [ano, mes] = baseRef.split("-").map(Number);
  const d = new Date(ano, (mes-1)+offset, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function mesLabel(ref){
  const [y,m] = ref.split("-");
  return `${MESES[parseInt(m,10)-1]}/${y.slice(2)}`;
}
function fmtMoney(v){
  return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}
function uid(){ return Math.random().toString(36).slice(2,10); }

const PALETA_CORES = ["#BE4D00","#C9A84C","#7A2E1D","#4f2c1d","#8a7350","#a86a3d"];

// Gráfico de rosca em SVG puro (sem dependência externa), recebe [{label, value}]
function DonutChart({data, size=150, onSliceClick, selecionado}){
  const dadosValidos = data.filter(d => d.value > 0);
  const total = dadosValidos.reduce((s,d)=>s+d.value,0);
  const radius = 52;
  const stroke = 22;
  const circumference = 2 * Math.PI * radius;
  let acumulado = 0;

  return (
    <svg viewBox="0 0 150 150" width={size} height={size}>
      <g transform="translate(75,75) rotate(-90)">
        {total === 0 && (
          <circle r={radius} fill="none" stroke="var(--paper-line)" strokeWidth={stroke} />
        )}
        {total > 0 && dadosValidos.map((d, i) => {
          const fracao = d.value / total;
          const dash = fracao * circumference;
          const offset = -acumulado * circumference;
          acumulado += fracao;
          const percentual = (fracao*100).toFixed(1);
          const ativo = selecionado === d.label;
          return (
            <circle
              key={i}
              r={radius}
              fill="none"
              stroke={d.color || PALETA_CORES[i % PALETA_CORES.length]}
              strokeWidth={ativo ? stroke+6 : stroke}
              strokeDasharray={`${dash} ${circumference - dash}`}
              strokeDashoffset={offset}
              style={{cursor: onSliceClick ? "pointer" : "default", transition:"stroke-width .15s"}}
              onClick={()=> onSliceClick && onSliceClick(d.label)}
            >
              <title>{`${d.label}: ${fmtMoney(d.value)} (${percentual}%)`}</title>
            </circle>
          );
        })}
      </g>
      <text x="75" y="70" textAnchor="middle" fontFamily="'IBM Plex Mono',monospace" fontSize="15" fontWeight="500" fill="var(--brown-700)">
        {fmtMoney(total)}
      </text>
      <text x="75" y="88" textAnchor="middle" fontFamily="'Work Sans',sans-serif" fontSize="10" fill="var(--ink-soft)">
        total
      </text>
    </svg>
  );
}

// Gráfico de linha em SVG puro, recebe [{label, value}] em ordem cronológica
function LineChart({data, height=170}){
  const width = 640;
  const padding = 44;
  const maxVal = Math.max(1, ...data.map(d=>d.value));
  const stepX = data.length>1 ? (width - padding*2) / (data.length-1) : 0;
  const pontos = data.map((d,i)=>{
    const x = padding + i*stepX;
    const y = height - padding - (d.value/maxVal) * (height - padding*2);
    return { ...d, x, y };
  });
  const linhaD = pontos.map((p,i)=> `${i===0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
  const areaD = pontos.length>0
    ? `${linhaD} L ${pontos[pontos.length-1].x} ${height-padding} L ${pontos[0].x} ${height-padding} Z`
    : "";

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} style={{maxWidth:640}}>
      <line x1={padding} y1={height-padding} x2={width-padding} y2={height-padding} stroke="var(--paper-line)" strokeWidth="1" />
      {pontos.length>0 && <path d={areaD} fill="var(--orange-soft)" opacity="0.5" />}
      {pontos.length>0 && <path d={linhaD} fill="none" stroke="var(--orange)" strokeWidth="2.5" />}
      {pontos.map((p,i)=>(
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4.5" fill="var(--orange)" stroke="#fff" strokeWidth="1.5" style={{cursor:"pointer"}}>
            <title>{`${p.label}: ${fmtMoney(p.value)}`}</title>
          </circle>
          <text x={p.x} y={height-padding+18} textAnchor="middle" fontSize="11" fontFamily="'Work Sans',sans-serif" fill="var(--ink-soft)">
            {p.label}
          </text>
        </g>
      ))}
    </svg>
  );
}



// Aplica as regras de categoria automática: procura a primeira regra cuja palavra-chave
// aparece na descrição (sem diferenciar maiúsculas/minúsculas/acentos) e devolve a categoria.
function categorizarAutomatico(descricao, regras){
  if(!descricao || !regras || regras.length===0) return null;
  const normalizar = (s) => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const descNorm = normalizar(descricao);
  const regra = regras.find(r => descNorm.includes(normalizar(r.palavraChave)));
  return regra ? regra.categoria : null;
}

// Calcula o status real de uma despesa: Pago (se marcado), Vencido (se tem vencimento
// no passado e não foi pago) ou A pagar (ainda dentro do prazo, ou sem vencimento definido).
function statusDespesa(l){
  if(l.status_pagamento === "pago") return "Pago";
  if(l.data_vencimento){
    const hoje = new Date();
    hoje.setHours(0,0,0,0);
    const venc = new Date(l.data_vencimento + "T00:00:00");
    if(venc < hoje) return "Vencido";
  }
  return "A pagar";
}

async function loadData(){
  try{
    await garantirLogin();
    const doc = await db.collection("financeiro").doc("dados").get();
    if(doc.exists){
      const parsed = doc.data();
      return { lancamentos: [], comprasCartao: [], categoriaRegras: [], ...parsed };
    }
  }catch(e){
    console.error("Erro ao carregar dados do Firestore:", e);
    throw e;
  }
  return { lancamentos: [], comprasCartao: [], categoriaRegras: [] };
}
async function saveData(data){
  await garantirLogin();
  await db.collection("financeiro").doc("dados").set(data);
}

function App(){
  const [view, setView] = useState("lancamentos");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [erroCarregamento, setErroCarregamento] = useState(null);
  const [erroSalvamento, setErroSalvamento] = useState(null);
  const [atualizando, setAtualizando] = useState(false);

  useEffect(()=>{
    loadData()
      .then(d=>{ setData(d); setLoading(false); })
      .catch(e=>{
        console.error("Falha ao carregar dados:", e);
        setErroCarregamento("Não consegui conectar ao banco de dados. Verifique a configuração do Firebase no topo do código, ou tente recarregar a página.");
        setLoading(false);
      });
  },[]);

  async function atualizarDados(){
    setAtualizando(true);
    try{
      const d = await loadData();
      setData(d);
    }catch(e){
      console.error("Falha ao atualizar dados:", e);
      setErroSalvamento("Não consegui buscar os dados mais recentes. Verifique sua internet.");
    }finally{
      setAtualizando(false);
    }
  }

  async function updateData(next){
    setData(next);
    setErroSalvamento(null);
    try{
      await saveData(next);
    }catch(e){
      console.error("Falha ao salvar dados:", e);
      setErroSalvamento("Não consegui salvar essa alteração. Verifique sua internet e tente de novo — se persistir, os dados podem não estar sendo guardados.");
    }
  }

  if(loading){
    return <div style={{padding:"40px",color:"#8a7a68",fontFamily:"'Work Sans',sans-serif"}}>
      <span className="loading-dot"></span>Carregando...
    </div>;
  }

  if(erroCarregamento){
    return <div style={{padding:"40px",color:"var(--wine)",fontFamily:"'Work Sans',sans-serif",maxWidth:500}}>
      {erroCarregamento}
    </div>;
  }

  return (
    <div className="app">
      <div className="sidebar">
        <p className="brand">Gestão Financeira</p>
        <div className={`nav-item ${view==="lancamentos"?"active":""}`} onClick={()=>setView("lancamentos")}>Lançamentos</div>
        <div className={`nav-item ${view==="cartao"?"active":""}`} onClick={()=>setView("cartao")}>Cartão de crédito</div>
        <div className={`nav-item ${view==="dashboard"?"active":""}`} onClick={()=>setView("dashboard")}>Dashboard</div>
        <button
          className="btn-ghost"
          style={{width:"100%", marginTop:16, color:"#d9c7b3", borderColor:"#4a2c1c"}}
          onClick={atualizarDados}
          disabled={atualizando}
        >
          {atualizando ? "Atualizando..." : "↻ Atualizar dados"}
        </button>
      </div>
      <div className="main">
        {erroSalvamento && (
          <div style={{background:"var(--wine-soft)", border:"1px solid var(--wine)", color:"var(--wine)", borderRadius:8, padding:"10px 14px", fontSize:13, marginBottom:16}}>
            {erroSalvamento}
          </div>
        )}
        {view==="lancamentos" && <Lancamentos data={data} updateData={updateData} />}
        {view==="cartao" && <Cartao data={data} updateData={updateData} />}
        {view==="dashboard" && <Dashboard data={data} />}
      </div>
    </div>
  );
}

function Categorias({data, updateData}){
  const [palavraChave, setPalavraChave] = useState("");
  const [categoria, setCategoria] = useState("");

  function addRegra(){
    if(!palavraChave || !categoria) return;
    const nova = { id: uid(), palavraChave: palavraChave.trim(), categoria: categoria.trim() };
    updateData({ ...data, categoriaRegras: [...(data.categoriaRegras||[]), nova] });
    setPalavraChave(""); setCategoria("");
  }
  function remover(id){
    updateData({ ...data, categoriaRegras: (data.categoriaRegras||[]).filter(r=>r.id!==id) });
  }

  const regras = data.categoriaRegras || [];

  return (
    <div>
      <h1>Categorias automáticas</h1>
      <p className="subtitle">Configure palavras-chave: sempre que aparecerem na descrição de um lançamento (manual, por voz ou de fatura), a categoria é preenchida sozinha.</p>

      <div className="card">
        <h2>Nova regra</h2>
        <div className="row row-3">
          <div>
            <label>Palavra-chave (aparece na descrição)</label>
            <input value={palavraChave} onChange={e=>setPalavraChave(e.target.value)} placeholder="ex: uber, 99, ifood" />
          </div>
          <div>
            <label>Categoria a aplicar</label>
            <select value={categoria} onChange={e=>setCategoria(e.target.value)}>
              <option value="">Selecione...</option>
              {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div style={{display:"flex", alignItems:"flex-end"}}>
            <button className="btn-primary" onClick={addRegra} style={{width:"100%"}}>Adicionar regra</button>
          </div>
        </div>
        <p className="helper">Não diferencia maiúsculas/minúsculas nem acentos. A primeira regra que combinar com a descrição é usada.</p>
      </div>

      <div className="card">
        <h2>Regras cadastradas</h2>
        {regras.length===0 && <div className="empty-state">Nenhuma regra ainda. Cadastre a primeira acima — ex: "uber" → "Transporte".</div>}
        {regras.map(r=>(
          <div className="ledger-row" key={r.id} style={{gridTemplateColumns:"auto 1fr auto"}}>
            <span className="tag tag-variavel">se contém "{r.palavraChave}"</span>
            <span style={{fontWeight:500}}>→ {r.categoria}</span>
            <button className="btn-danger" onClick={()=>remover(r.id)}>Remover</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function Lancamentos({data, updateData}){
  const [tipo, setTipo] = useState("receita");
  const [natureza, setNatureza] = useState("fixa");
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [categoria, setCategoria] = useState("");
  const [mesRef, setMesRef] = useState(mesRefAtual());
  const [formaPagamento, setFormaPagamento] = useState("");
  const [dataVencimento, setDataVencimento] = useState("");
  const [statusPagamento, setStatusPagamento] = useState("pendente");
  const [listening, setListening] = useState(false);
  const [processingVoice, setProcessingVoice] = useState(false);
  const [transcript, setTranscript] = useState("");
  const [voiceError, setVoiceError] = useState(null);
  const [revisaoVoz, setRevisaoVoz] = useState(null);
  const [erroValidacao, setErroValidacao] = useState(null);
  const [editandoId, setEditandoId] = useState(null);
  const [edicaoTemp, setEdicaoTemp] = useState(null);
  const recognitionRef = useRef(null);

  async function parseVoiceText(texto){
    setProcessingVoice(true);
    setVoiceError(null);
    if(URL_PARSE_VOZ.startsWith("COLE_AQUI")){
      setVoiceError("As URLs da Cloud Function ainda não foram preenchidas no código (topo do arquivo).");
      setProcessingVoice(false);
      return;
    }
    try{
      const response = await fetch(URL_PARSE_VOZ, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto })
      });
      const json = await response.json();
      if(!response.ok || json.error){
        throw new Error(json.error || "Erro ao interpretar o áudio");
      }
      const itens = json.lancamentos || [];
      if(itens.length===0) throw new Error("Não entendi nenhum lançamento na fala.");
      setRevisaoVoz(itens.map(item => {
        const regraCategoria = categorizarAutomatico(item.descricao, data.categoriaRegras);
        return {
          id: uid(),
          tipo: item.tipo === "receita" ? "receita" : "despesa",
          natureza: item.natureza === "fixa" ? "fixa" : "variavel",
          descricao: item.descricao || "",
          valor: item.valor || 0,
          categoria: regraCategoria || item.categoria || "Outros",
          forma_pagamento: item.forma_pagamento || "",
          mes_referencia: mesRefAtual(),
        };
      }));
    }catch(e){
      console.error("Erro ao interpretar voz:", e);
      setVoiceError("Não consegui interpretar o áudio automaticamente. Preencha manualmente abaixo.");
    }finally{
      setProcessingVoice(false);
    }
  }

  function atualizarItemRevisao(id, campo, valor){
    setRevisaoVoz(itens => itens.map(it => it.id===id ? {...it, [campo]: valor} : it));
  }
  function removerItemRevisao(id){
    setRevisaoVoz(itens => itens.filter(it => it.id!==id));
  }
  function confirmarRevisaoVoz(){
    const novos = revisaoVoz.map(item => ({
      id: uid(),
      tipo: item.tipo,
      natureza: item.natureza,
      descricao: item.descricao,
      valor: parseFloat(item.valor) || 0,
      categoria: item.categoria || "Outros",
      forma_pagamento: item.forma_pagamento || null,
      mes_referencia: item.mes_referencia,
      data_vencimento: null,
      status_pagamento: item.tipo==="despesa" ? "pendente" : null,
    }));
    updateData({ ...data, lancamentos: [...novos, ...data.lancamentos] });
    setRevisaoVoz(null);
    setTranscript("");
  }
  function cancelarRevisaoVoz(){
    setRevisaoVoz(null);
    setTranscript("");
  }

  function toggleVoice(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
      setVoiceError("Comando por voz não é suportado neste navegador. Tente no Chrome.");
      return;
    }
    if(listening && recognitionRef.current){
      recognitionRef.current.stop();
      return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = "pt-BR";
    recognition.interimResults = false;
    recognition.continuous = true; // permite falar vários lançamentos com pausa, até você tocar de novo pra parar
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { setListening(true); setTranscript(""); setVoiceError(null); };
    recognition.onresult = (event) => {
      let textoCompleto = "";
      for(let i=0; i<event.results.length; i++){
        textoCompleto += event.results[i][0].transcript + ". ";
      }
      setTranscript(textoCompleto.trim());
    };
    recognition.onerror = () => { setVoiceError("Não consegui captar o áudio. Verifique a permissão do microfone."); setListening(false); };
    recognition.onend = () => {
      setListening(false);
      setTranscript(atual => {
        if(atual) parseVoiceText(atual);
        return atual;
      });
    };
    recognitionRef.current = recognition;
    recognition.start();
  }

  function addLancamento(){
    if(!descricao || !valor){
      const faltando = [];
      if(!descricao) faltando.push("Descrição");
      if(!valor) faltando.push("Valor");
      setErroValidacao(`Preencha antes de adicionar: ${faltando.join(" e ")}.`);
      return;
    }
    setErroValidacao(null);
    const novo = {
      id: uid(),
      tipo, natureza, descricao,
      valor: parseFloat(valor),
      categoria: categoria || "Outros",
      mes_referencia: mesRef,
      forma_pagamento: formaPagamento || null,
      data_vencimento: tipo==="despesa" ? (dataVencimento || null) : null,
      status_pagamento: tipo==="despesa" ? statusPagamento : null,
    };
    const next = { ...data, lancamentos: [novo, ...data.lancamentos] };
    updateData(next);
    setDescricao(""); setValor(""); setCategoria(""); setFormaPagamento(""); setTranscript(""); setDataVencimento(""); setStatusPagamento("pendente");
  }
  function remover(id){
    updateData({ ...data, lancamentos: data.lancamentos.filter(l=>l.id!==id) });
  }
  function iniciarEdicaoLancamento(l){
    setEditandoId(l.id);
    setEdicaoTemp({
      tipo: l.tipo,
      natureza: l.natureza,
      descricao: l.descricao,
      valor: l.valor,
      categoria: l.categoria || "Outros",
      mes_referencia: l.mes_referencia,
      forma_pagamento: l.forma_pagamento || "",
      data_vencimento: l.data_vencimento || "",
      status_pagamento: l.status_pagamento || "pendente",
    });
  }
  function salvarEdicaoLancamento(id){
    updateData({
      ...data,
      lancamentos: data.lancamentos.map(x => x.id===id
        ? {
            ...x,
            tipo: edicaoTemp.tipo,
            natureza: edicaoTemp.natureza,
            descricao: edicaoTemp.descricao,
            valor: parseFloat(edicaoTemp.valor),
            categoria: edicaoTemp.categoria,
            mes_referencia: edicaoTemp.mes_referencia,
            forma_pagamento: edicaoTemp.forma_pagamento || null,
            data_vencimento: edicaoTemp.tipo==="despesa" ? (edicaoTemp.data_vencimento || null) : null,
            status_pagamento: edicaoTemp.tipo==="despesa" ? edicaoTemp.status_pagamento : null,
          }
        : x
      )
    });
    setEditandoId(null);
    setEdicaoTemp(null);
  }
  function cancelarEdicaoLancamento(){
    setEditandoId(null);
    setEdicaoTemp(null);
  }

  const ordenados = [...data.lancamentos].sort((a,b)=> b.mes_referencia.localeCompare(a.mes_referencia));

  return (
    <div>
      <h1>Lançamentos</h1>
      <p className="subtitle">Receitas e despesas, fixas ou variáveis.</p>

      <div className="card">
        <h2>Novo lançamento</h2>
        <div className="voice-bar">
          <button
            type="button"
            className={`btn-mic ${listening ? "listening" : ""}`}
            onClick={toggleVoice}
          >
            <span className="mic-dot"></span>
            {listening ? "Ouvindo... toque para parar" : processingVoice ? "Interpretando..." : "Adicionar por voz"}
          </button>
          {transcript && <span className="voice-transcript">"{transcript}"</span>}
        </div>
        {listening && <p className="helper" style={{marginTop:-8, marginBottom:14}}>Pode falar mais de um lançamento seguido (ex: "gastei 50 de gasolina, recebi 200 de consultoria"). Toque no botão de novo quando terminar.</p>}
        {voiceError && <p className="helper" style={{color:"var(--wine)", marginTop:-8, marginBottom:14}}>{voiceError}</p>}

        {revisaoVoz && (
          <div style={{marginBottom:16}}>
            <p className="helper" style={{marginBottom:10}}>
              Entendi {revisaoVoz.length} {revisaoVoz.length===1 ? "lançamento" : "lançamentos"} — confira antes de adicionar:
            </p>
            <table className="review-table">
              <thead>
                <tr><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Categoria</th><th>Pagamento</th><th></th></tr>
              </thead>
              <tbody>
                {revisaoVoz.map(item=>(
                  <tr key={item.id}>
                    <td>
                      <select value={item.tipo} onChange={e=>atualizarItemRevisao(item.id,"tipo",e.target.value)}>
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                      </select>
                    </td>
                    <td><input value={item.descricao} onChange={e=>atualizarItemRevisao(item.id,"descricao",e.target.value)} style={{minWidth:140}} /></td>
                    <td><input type="number" step="0.01" style={{width:90}} value={item.valor} onChange={e=>atualizarItemRevisao(item.id,"valor",e.target.value)} /></td>
                    <td>
                      <select value={item.categoria} onChange={e=>atualizarItemRevisao(item.id,"categoria",e.target.value)}>
                        {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </td>
                    <td>
                      <select value={item.forma_pagamento} onChange={e=>atualizarItemRevisao(item.id,"forma_pagamento",e.target.value)}>
                        <option value="">-</option>
                        {FORMAS_PAGAMENTO.map(f => <option key={f} value={f}>{f}</option>)}
                      </select>
                    </td>
                    <td><button className="btn-danger" onClick={()=>removerItemRevisao(item.id)}>Remover</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{marginTop:14, display:"flex", gap:10}}>
              <button className="btn-primary" onClick={confirmarRevisaoVoz}>Confirmar e adicionar {revisaoVoz.length>1?"todos":""}</button>
              <button className="btn-ghost" onClick={cancelarRevisaoVoz}>Cancelar</button>
            </div>
          </div>
        )}

        {!revisaoVoz && (
        <React.Fragment>
        <div className="row row-4">
          <div>
            <label>Tipo</label>
            <select value={tipo} onChange={e=>setTipo(e.target.value)}>
              <option value="receita">Receita</option>
              <option value="despesa">Despesa</option>
            </select>
          </div>
          <div>
            <label>Natureza</label>
            <select value={natureza} onChange={e=>setNatureza(e.target.value)}>
              <option value="fixa">Fixa</option>
              <option value="variavel">Variável</option>
            </select>
          </div>
          <div>
            <label>Categoria</label>
            <select value={categoria} onChange={e=>setCategoria(e.target.value)}>
              <option value="">Selecione...</option>
              {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label>Mês de referência</label>
            <input type="month" value={mesRef} onChange={e=>setMesRef(e.target.value)} />
          </div>
        </div>
        <div className="row row-3">
          <div>
            <label>Descrição</label>
            <input
              value={descricao}
              onChange={e=>setDescricao(e.target.value)}
              onBlur={()=>{
                if(!categoria){
                  const regraCategoria = categorizarAutomatico(descricao, data.categoriaRegras);
                  if(regraCategoria) setCategoria(regraCategoria);
                }
              }}
              placeholder="ex: consultoria cliente X, uber, ifood"
            />
          </div>
          <div>
            <label>Valor (R$)</label>
            <input type="number" step="0.01" value={valor} onChange={e=>setValor(e.target.value)} placeholder="0,00" />
          </div>
          <div>
            <label>Forma de pagamento (opcional)</label>
            <select value={formaPagamento} onChange={e=>setFormaPagamento(e.target.value)}>
              <option value="">-</option>
              {FORMAS_PAGAMENTO.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>
        </div>
        {tipo==="despesa" && (
          <div className="row row-2">
            <div>
              <label>Data de vencimento (opcional)</label>
              <input type="date" value={dataVencimento} onChange={e=>setDataVencimento(e.target.value)} />
            </div>
            <div>
              <label>Status</label>
              <select value={statusPagamento} onChange={e=>setStatusPagamento(e.target.value)}>
                <option value="pendente">A pagar</option>
                <option value="pago">Pago</option>
              </select>
            </div>
          </div>
        )}
        <button className="btn-primary" onClick={addLancamento}>Adicionar lançamento</button>
        {erroValidacao && <p className="helper" style={{color:"var(--wine)", marginTop:8}}>{erroValidacao}</p>}
        </React.Fragment>
        )}
      </div>

      <div className="card">
        <h2>Histórico</h2>
        {ordenados.length===0 && <div className="empty-state">Nenhum lançamento ainda. Adicione o primeiro acima.</div>}
        {ordenados.map(l=>{
          if(editandoId === l.id){
            return (
              <div key={l.id} style={{padding:"14px 0", borderBottom:"1px dashed var(--paper-line)"}}>
                <div className="row row-4" style={{marginBottom:10}}>
                  <div>
                    <label>Tipo</label>
                    <select value={edicaoTemp.tipo} onChange={e=>setEdicaoTemp({...edicaoTemp, tipo:e.target.value})}>
                      <option value="receita">Receita</option>
                      <option value="despesa">Despesa</option>
                    </select>
                  </div>
                  <div>
                    <label>Natureza</label>
                    <select value={edicaoTemp.natureza} onChange={e=>setEdicaoTemp({...edicaoTemp, natureza:e.target.value})}>
                      <option value="fixa">Fixa</option>
                      <option value="variavel">Variável</option>
                    </select>
                  </div>
                  <div>
                    <label>Categoria</label>
                    <select value={edicaoTemp.categoria} onChange={e=>setEdicaoTemp({...edicaoTemp, categoria:e.target.value})}>
                      {CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label>Mês de referência</label>
                    <input type="month" value={edicaoTemp.mes_referencia} onChange={e=>setEdicaoTemp({...edicaoTemp, mes_referencia:e.target.value})} />
                  </div>
                </div>
                <div className="row row-3" style={{marginBottom:10}}>
                  <div>
                    <label>Descrição</label>
                    <input value={edicaoTemp.descricao} onChange={e=>setEdicaoTemp({...edicaoTemp, descricao:e.target.value})} />
                  </div>
                  <div>
                    <label>Valor (R$)</label>
                    <input type="number" step="0.01" value={edicaoTemp.valor} onChange={e=>setEdicaoTemp({...edicaoTemp, valor:e.target.value})} />
                  </div>
                  <div>
                    <label>Forma de pagamento</label>
                    <select value={edicaoTemp.forma_pagamento} onChange={e=>setEdicaoTemp({...edicaoTemp, forma_pagamento:e.target.value})}>
                      <option value="">-</option>
                      {FORMAS_PAGAMENTO.map(f => <option key={f} value={f}>{f}</option>)}
                    </select>
                  </div>
                </div>
                {edicaoTemp.tipo==="despesa" && (
                  <div className="row row-2" style={{marginBottom:10}}>
                    <div>
                      <label>Data de vencimento (opcional)</label>
                      <input type="date" value={edicaoTemp.data_vencimento} onChange={e=>setEdicaoTemp({...edicaoTemp, data_vencimento:e.target.value})} />
                    </div>
                    <div>
                      <label>Status</label>
                      <select value={edicaoTemp.status_pagamento} onChange={e=>setEdicaoTemp({...edicaoTemp, status_pagamento:e.target.value})}>
                        <option value="pendente">A pagar</option>
                        <option value="pago">Pago</option>
                      </select>
                    </div>
                  </div>
                )}
                <div style={{display:"flex", gap:8}}>
                  <button className="btn-primary" onClick={()=>salvarEdicaoLancamento(l.id)}>Salvar</button>
                  <button className="btn-ghost" onClick={cancelarEdicaoLancamento}>Cancelar</button>
                </div>
              </div>
            );
          }
          const status = l.tipo==="despesa" ? statusDespesa(l) : null;
          const tagClasse = status==="Pago" ? "tag-pago" : status==="Vencido" ? "tag-vencido" : "tag-apagar";
          return (
            <div className="ledger-row" key={l.id}>
              <span className={`tag ${l.tipo==="receita"?"tag-receita":"tag-despesa"}`}>{l.tipo}</span>
              <div>
                <div style={{fontWeight:500}}>{l.descricao}</div>
                <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                  {l.categoria} · <span className={`tag ${l.natureza==="fixa"?"tag-fixa":"tag-variavel"}`}>{l.natureza}</span> · {mesLabel(l.mes_referencia)}
                  {status && <> · <span className={`tag ${tagClasse}`}>{status}</span></>}
                  {l.data_vencimento && <> · vence {l.data_vencimento.split("-").reverse().join("/")}</>}
                  {l.forma_pagamento && <> · {l.forma_pagamento}</>}
                </div>
              </div>
              <span className={`money ${l.tipo==="receita"?"pos":"neg"}`}>{l.tipo==="receita"?"+":"-"}{fmtMoney(l.valor)}</span>
              <div style={{display:"flex", gap:6}}>
                {status && status!=="Pago" && (
                  <button
                    className="btn-ghost"
                    onClick={()=>updateData({ ...data, lancamentos: data.lancamentos.map(x=>x.id===l.id?{...x, status_pagamento:"pago"}:x) })}
                  >
                    Marcar pago
                  </button>
                )}
                {status === "Pago" && (
                  <button
                    className="btn-ghost"
                    onClick={()=>updateData({ ...data, lancamentos: data.lancamentos.map(x=>x.id===l.id?{...x, status_pagamento:"pendente"}:x) })}
                  >
                    Desfazer
                  </button>
                )}
                <button className="btn-ghost" onClick={()=>iniciarEdicaoLancamento(l)}>Editar</button>
              </div>
              <button className="btn-danger" onClick={()=>remover(l.id)}>Remover</button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Cartao({data, updateData}){
  const [imageBase64, setImageBase64] = useState(null);
  const [processing, setProcessing] = useState(false);
  const [reviewItems, setReviewItems] = useState(null);
  const [error, setError] = useState(null);
  const [mesPagamentoFatura, setMesPagamentoFatura] = useState(mesRefAtual());
  const [editandoId, setEditandoId] = useState(null);
  const [edicaoTemp, setEdicaoTemp] = useState(null);
  const [mesFiltroGastos, setMesFiltroGastos] = useState(mesRefAtual());
  const [mensagemReconciliacao, setMensagemReconciliacao] = useState(null);
  const fileRef = useRef(null);

  function iniciarEdicao(c){
    setEditandoId(c.id);
    setEdicaoTemp({ descricao: c.descricao, valor_parcela: c.valor_parcela, responsavel: c.responsavel });
  }
  function salvarEdicao(id){
    updateData({
      ...data,
      comprasCartao: data.comprasCartao.map(x => x.id===id
        ? { ...x, descricao: edicaoTemp.descricao, valor_parcela: parseFloat(edicaoTemp.valor_parcela), responsavel: edicaoTemp.responsavel }
        : x
      )
    });
    setEditandoId(null);
    setEdicaoTemp(null);
  }
  function cancelarEdicao(){
    setEditandoId(null);
    setEdicaoTemp(null);
  }

  function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const base64 = reader.result.split(",")[1];
      setImageBase64({ data: base64, mediaType: file.type });
      runOcr(base64, file.type);
    };
    reader.readAsDataURL(file);
  }

  async function runOcr(base64, mediaType){
    setProcessing(true);
    setError(null);
    if(URL_PARSE_FATURA.startsWith("COLE_AQUI")){
      setError("As URLs da Cloud Function ainda não foram preenchidas no código (topo do arquivo).");
      setProcessing(false);
      return;
    }
    try{
      const response = await fetch(URL_PARSE_FATURA, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mediaType })
      });
      const json = await response.json();
      if(!response.ok || json.error){
        throw new Error(json.error || "Erro ao processar a fatura");
      }
      const parsed = json.itens;
      setReviewItems(parsed.map(item => ({
        id: uid(),
        descricao: item.descricao || "",
        valor_parcela: item.valor_parcela || 0,
        parcela_atual: item.parcela_atual || 1,
        parcela_total: item.parcela_total || 1,
        responsavel: "",
        categoria: categorizarAutomatico(item.descricao, data.categoriaRegras) || "Outros",
      })));
    }catch(e){
      console.error("Erro ao ler fatura:", e);
      setError("Não consegui ler a fatura. Tente uma foto mais nítida ou lance manualmente.");
    }finally{
      setProcessing(false);
    }
  }

  function updateItem(id, field, value){
    setReviewItems(items => items.map(it => it.id===id ? {...it, [field]: value} : it));
  }
  function removeItem(id){
    setReviewItems(items => items.filter(it => it.id!==id));
  }

  function normalizarTexto(s){
    return (s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  }

  function confirmarImportacao(){
    const novasCompras = [];
    const atualizacoes = [];
    const origemBase = uid();
    let reconciliadas = 0;

    reviewItems.forEach(item => {
      const mesDestaParcela = mesPagamentoFatura;

      // Essa parcela específica (mesma descrição + número da parcela + mês) já existe?
      // Se sim, foi provisionada numa importação anterior — atualiza em vez de duplicar.
      const existente = data.comprasCartao.find(c =>
        normalizarTexto(c.descricao) === normalizarTexto(item.descricao) &&
        c.parcela_atual === item.parcela_atual &&
        c.parcela_total === item.parcela_total &&
        c.mes_referencia === mesDestaParcela
      );

      if(existente){
        reconciliadas++;
        atualizacoes.push({
          id: existente.id,
          valor_parcela: parseFloat(item.valor_parcela),
          responsavel: item.responsavel || existente.responsavel,
          categoria: item.categoria || existente.categoria,
        });
        return; // não gera parcelas futuras de novo — já foram criadas na importação anterior
      }

      // Não existia: é uma compra nova (ou a fatura ainda não tinha sido importada antes).
      // Gera essa parcela e todas as futuras normalmente.
      const restantes = Math.max(1, item.parcela_total - item.parcela_atual + 1);
      const origemId = origemBase + "-" + item.id;
      for(let i=0; i<restantes; i++){
        novasCompras.push({
          id: uid(),
          compra_origem_id: origemId,
          descricao: item.descricao,
          valor_parcela: parseFloat(item.valor_parcela),
          parcela_atual: item.parcela_atual + i,
          parcela_total: item.parcela_total,
          responsavel: item.responsavel || "não informado",
          categoria: item.categoria,
          mes_referencia: mesRefDesde(mesPagamentoFatura, i),
        });
      }
    });

    const comprasAtualizadas = data.comprasCartao.map(c => {
      const upd = atualizacoes.find(a => a.id === c.id);
      return upd ? { ...c, valor_parcela: upd.valor_parcela, responsavel: upd.responsavel, categoria: upd.categoria } : c;
    });

    updateData({ ...data, comprasCartao: [...novasCompras, ...comprasAtualizadas] });
    setReviewItems(null);
    setImageBase64(null);
    if(fileRef.current) fileRef.current.value = "";
    if(reconciliadas > 0){
      setMensagemReconciliacao(`${reconciliadas} ${reconciliadas===1 ? "item já estava" : "itens já estavam"} provisionado(s) de uma importação anterior — foram atualizados, não duplicados.`);
    }
  }

  const comprasOrdenadas = [...data.comprasCartao].sort((a,b)=> b.mes_referencia.localeCompare(a.mes_referencia));

  // Gasto por estabelecimento (descrição), só compras de verdade, no mês filtrado
  const porEstabelecimento = {};
  data.comprasCartao
    .filter(c => c.mes_referencia === mesFiltroGastos && c.valor_parcela > 0)
    .forEach(c => {
      const chave = normalizarEstabelecimento(c.descricao);
      if(!porEstabelecimento[chave]) porEstabelecimento[chave] = { total: 0, qtd: 0 };
      porEstabelecimento[chave].total += c.valor_parcela;
      porEstabelecimento[chave].qtd += 1;
    });
  const gastosPorEstabelecimento = Object.entries(porEstabelecimento)
    .map(([descricao, v]) => ({ descricao, total: v.total, qtd: v.qtd }))
    .sort((a,b) => b.total - a.total);
  const totalEstabelecimentos = gastosPorEstabelecimento.reduce((s,e)=>s+e.total,0);

  return (
    <div>
      <h1>Cartão de crédito</h1>
      <p className="subtitle">Suba o print ou o PDF da fatura. O sistema lê as compras, projeta as parcelas futuras e deixa você marcar quem fez cada compra.</p>
      {mensagemReconciliacao && (
        <div style={{background:"var(--gold-soft)", border:"1px solid var(--gold)", color:"#6b5216", borderRadius:8, padding:"10px 14px", fontSize:13, marginBottom:16}}>
          {mensagemReconciliacao}
          <button className="btn-ghost" style={{marginLeft:12, padding:"3px 10px", fontSize:12}} onClick={()=>setMensagemReconciliacao(null)}>Ok</button>
        </div>
      )}

      {!reviewItems && (
        <div className="card">
          <h2>Importar fatura</h2>
          <div className="row row-2" style={{marginBottom:16}}>
            <div>
              <label>Mês em que essa fatura é paga</label>
              <input type="month" value={mesPagamentoFatura} onChange={e=>setMesPagamentoFatura(e.target.value)} />
              <p className="helper" style={{marginTop:4}}>O mês em que a fatura é efetivamente paga/cobrada (não o mês de fechamento). Ex: fatura fechada em junho mas paga em julho → escolha julho aqui. As parcelas futuras são contadas a partir desse mês.</p>
            </div>
          </div>
          <div className="upload-zone" onClick={()=>fileRef.current.click()}>
            {processing ? <span><span className="loading-dot"></span>Lendo a fatura...</span> : "Clique para enviar o print ou o PDF da fatura"}
          </div>
          <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={handleFile} />
          {error && <p className="helper" style={{color:"var(--wine)"}}>{error}</p>}
        </div>
      )}

      {reviewItems && (
        <div className="card">
          <h2>Confira antes de importar</h2>
          <p className="helper" style={{marginBottom:14}}>Ajuste valores se o OCR errar algo e marque quem fez cada compra. Créditos, estornos ou pagamentos recebidos devem ter valor negativo (ex: -150.00) — eles abatem do total automaticamente.</p>
          <table className="review-table">
            <thead>
              <tr><th>Descrição</th><th>Valor parcela</th><th>Parcela</th><th>Total parcelas</th><th>Quem comprou</th><th></th></tr>
            </thead>
            <tbody>
              {reviewItems.map(item=>(
                <tr key={item.id}>
                  <td><input value={item.descricao} onChange={e=>updateItem(item.id,"descricao",e.target.value)} /></td>
                  <td><input type="number" step="0.01" style={{width:90}} value={item.valor_parcela} onChange={e=>updateItem(item.id,"valor_parcela",e.target.value)} /></td>
                  <td><input type="number" style={{width:60}} value={item.parcela_atual} onChange={e=>updateItem(item.id,"parcela_atual",parseInt(e.target.value)||1)} /></td>
                  <td><input type="number" style={{width:60}} value={item.parcela_total} onChange={e=>updateItem(item.id,"parcela_total",parseInt(e.target.value)||1)} /></td>
                  <td><input value={item.responsavel} onChange={e=>updateItem(item.id,"responsavel",e.target.value)} placeholder="ex: Eu, Marido" /></td>
                  <td><button className="btn-danger" onClick={()=>removeItem(item.id)}>Remover</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{marginTop:18,display:"flex",gap:10}}>
            <button className="btn-primary" onClick={confirmarImportacao}>Confirmar e projetar parcelas futuras</button>
            <button className="btn-ghost" onClick={()=>{setReviewItems(null); setImageBase64(null);}}>Cancelar</button>
          </div>
        </div>
      )}

      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
          <h2 style={{marginBottom:0}}>Gasto por estabelecimento</h2>
          <div>
            <label>Ver mês</label>
            <input type="month" value={mesFiltroGastos} onChange={e=>setMesFiltroGastos(e.target.value)} />
          </div>
        </div>
        <p className="helper" style={{marginBottom:14}}>Total gasto com cada descrição de compra (ex: Uber, Padaria) no mês selecionado.</p>
        {gastosPorEstabelecimento.length===0 && <div className="empty-state">Nenhuma compra nesse mês.</div>}
        {gastosPorEstabelecimento.map(e=>(
          <div className="ledger-row" key={e.descricao} style={{gridTemplateColumns:"1fr auto auto"}}>
            <span style={{fontWeight:500}}>{e.descricao}</span>
            <span style={{fontSize:12, color:"var(--ink-soft)"}}>{e.qtd}x</span>
            <span className="money neg">{fmtMoney(e.total)}</span>
          </div>
        ))}
        {gastosPorEstabelecimento.length>0 && (
          <div className="ledger-row" style={{gridTemplateColumns:"1fr auto", borderTop:"1px solid var(--paper-line)", marginTop:4, paddingTop:12}}>
            <span style={{fontWeight:600}}>Total do mês</span>
            <span className="money neg" style={{fontWeight:600}}>{fmtMoney(totalEstabelecimentos)}</span>
          </div>
        )}
      </div>

      <div className="card">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4}}>
          <h2 style={{marginBottom:0}}>Compras registradas</h2>
          {comprasOrdenadas.length>0 && (
            <button
              className="btn-danger"
              onClick={()=>{
                if(window.confirm(`Isso vai apagar TODAS as ${data.comprasCartao.length} linhas de cartão importadas (todas as faturas, todos os meses). Não dá pra desfazer. Confirma?`)){
                  updateData({ ...data, comprasCartao: [] });
                }
              }}
            >
              Limpar tudo
            </button>
          )}
        </div>
        {comprasOrdenadas.length===0 && <div className="empty-state">Nenhuma compra de cartão importada ainda.</div>}
        {comprasOrdenadas.map(c=>{
          if(editandoId === c.id){
            return (
              <div key={c.id} style={{padding:"12px 0", borderBottom:"1px dashed var(--paper-line)"}}>
                <div className="row row-3" style={{marginBottom:10}}>
                  <div>
                    <label>Descrição</label>
                    <input value={edicaoTemp.descricao} onChange={e=>setEdicaoTemp({...edicaoTemp, descricao:e.target.value})} />
                  </div>
                  <div>
                    <label>Valor da parcela</label>
                    <input type="number" step="0.01" value={edicaoTemp.valor_parcela} onChange={e=>setEdicaoTemp({...edicaoTemp, valor_parcela:e.target.value})} />
                  </div>
                  <div>
                    <label>Quem comprou</label>
                    <input value={edicaoTemp.responsavel} onChange={e=>setEdicaoTemp({...edicaoTemp, responsavel:e.target.value})} placeholder="ex: Eu, Marido" />
                  </div>
                </div>
                <div style={{display:"flex", gap:8}}>
                  <button className="btn-primary" onClick={()=>salvarEdicao(c.id)}>Salvar</button>
                  <button className="btn-ghost" onClick={cancelarEdicao}>Cancelar</button>
                </div>
              </div>
            );
          }
          return (
            <div className="ledger-row" key={c.id}>
              <div className="stamp">{(c.responsavel||"?").slice(0,2).toUpperCase()}</div>
              <div>
                <div style={{fontWeight:500}}>{c.descricao}</div>
                <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                  parcela {c.parcela_atual}/{c.parcela_total} · {c.responsavel} · {mesLabel(c.mes_referencia)}
                </div>
              </div>
              <span className={`money ${(-c.valor_parcela)<0 ? "neg" : "pos"}`}>
                {(-c.valor_parcela)>=0 ? "+" : ""}{fmtMoney(-c.valor_parcela)}
              </span>
              <button className="btn-ghost" onClick={()=>iniciarEdicao(c)}>Editar</button>
              <button
                className="btn-danger"
                onClick={()=>updateData({ ...data, comprasCartao: data.comprasCartao.filter(x=>x.id!==c.id) })}
              >
                Remover
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function Dashboard({data}){
  const [mesFiltro, setMesFiltro] = useState(mesRefAtual());
  const [mesDetalhe, setMesDetalhe] = useState(null);
  const [detalheCategoria, setDetalheCategoria] = useState(null);
  const [detalhePessoa, setDetalhePessoa] = useState(null);
  const [detalheStatus, setDetalheStatus] = useState(null);
  const [detalheReceita, setDetalheReceita] = useState(null);
  const lancamentosMes = data.lancamentos.filter(l=>l.mes_referencia===mesFiltro);
  const comprasMes = data.comprasCartao.filter(c=>c.mes_referencia===mesFiltro);

  const receitas = lancamentosMes.filter(l=>l.tipo==="receita").reduce((s,l)=>s+l.valor,0);
  const despesasDiretas = lancamentosMes.filter(l=>l.tipo==="despesa").reduce((s,l)=>s+l.valor,0);
  const despesaCartao = comprasMes.reduce((s,c)=>s+c.valor_parcela,0);
  const despesasTotal = despesasDiretas + despesaCartao;
  const saldo = receitas - despesasTotal;

  // Gasto por pessoa (cartão) — só considera compras de verdade (valor positivo);
  // créditos/estornos não são "gasto de alguém", então ficam de fora daqui.
  const porPessoa = {};
  const itensPorPessoa = {};
  comprasMes.filter(c=>c.valor_parcela > 0).forEach(c=>{
    porPessoa[c.responsavel] = (porPessoa[c.responsavel]||0) + c.valor_parcela;
    if(!itensPorPessoa[c.responsavel]) itensPorPessoa[c.responsavel] = [];
    itensPorPessoa[c.responsavel].push(c);
  });
  const dadosPessoa = Object.entries(porPessoa)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({ label, value, color: PALETA_CORES[i % PALETA_CORES.length] }));
  const creditosMes = comprasMes.filter(c=>c.valor_parcela < 0).reduce((s,c)=>s+c.valor_parcela,0);

  // Gasto por categoria (despesas diretas + cartão, mês atual)
  const porCategoria = {};
  const itensPorCategoria = {};
  lancamentosMes.filter(l=>l.tipo==="despesa").forEach(l=>{
    const cat = l.categoria||"Outros";
    porCategoria[cat] = (porCategoria[cat]||0) + l.valor;
    if(!itensPorCategoria[cat]) itensPorCategoria[cat] = [];
    itensPorCategoria[cat].push({ tipo:"lancamento", descricao:l.descricao, valor:l.valor, extra: l.forma_pagamento });
  });
  comprasMes.forEach(c=>{
    porCategoria["Cartão de crédito"] = (porCategoria["Cartão de crédito"]||0) + c.valor_parcela;
    if(!itensPorCategoria["Cartão de crédito"]) itensPorCategoria["Cartão de crédito"] = [];
    itensPorCategoria["Cartão de crédito"].push({ tipo:"cartao", descricao:c.descricao, valor:c.valor_parcela, extra: c.responsavel });
  });
  const dadosCategoria = Object.entries(porCategoria)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({ label, value, color: PALETA_CORES[i % PALETA_CORES.length] }));

  // Despesas por status (Pago / A pagar / Vencido) — só lançamentos diretos com vencimento/status
  const CORES_STATUS = { "Pago": "#3B6D11", "A pagar": "#C9A84C", "Vencido": "#7A2E1D" };
  const porStatus = {};
  const itensPorStatus = {};
  lancamentosMes.filter(l=>l.tipo==="despesa").forEach(l=>{
    const st = statusDespesa(l);
    porStatus[st] = (porStatus[st]||0) + l.valor;
    if(!itensPorStatus[st]) itensPorStatus[st] = [];
    itensPorStatus[st].push(l);
  });
  const dadosStatus = ["Pago","A pagar","Vencido"]
    .filter(st => porStatus[st] > 0)
    .map(st => ({ label: st, value: porStatus[st], color: CORES_STATUS[st] }));

  // Receita por descrição (mês filtrado)
  const porReceita = {};
  const itensPorReceita = {};
  lancamentosMes.filter(l=>l.tipo==="receita").forEach(l=>{
    const chave = l.descricao || "Sem descrição";
    porReceita[chave] = (porReceita[chave]||0) + l.valor;
    if(!itensPorReceita[chave]) itensPorReceita[chave] = [];
    itensPorReceita[chave].push(l);
  });
  const dadosReceita = Object.entries(porReceita)
    .sort((a,b)=>b[1]-a[1])
    .map(([label,value],i)=>({ label, value, color: PALETA_CORES[i % PALETA_CORES.length] }));

  // Alerta de contas a pagar — olha TODAS as despesas com vencimento, não só o mês filtrado
  const hojeDate = new Date();
  hojeDate.setHours(0,0,0,0);
  const hojeStr = `${hojeDate.getFullYear()}-${String(hojeDate.getMonth()+1).padStart(2,"0")}-${String(hojeDate.getDate()).padStart(2,"0")}`;
  const em7dias = new Date(hojeDate);
  em7dias.setDate(em7dias.getDate()+7);
  const despesasPendentes = data.lancamentos.filter(l => l.tipo==="despesa" && l.status_pagamento!=="pago" && l.data_vencimento);
  const contasVencidas = despesasPendentes
    .filter(l => new Date(l.data_vencimento+"T00:00:00") < hojeDate)
    .sort((a,b)=>a.data_vencimento.localeCompare(b.data_vencimento));
  const contasVenceHoje = despesasPendentes.filter(l => l.data_vencimento === hojeStr);
  const contasProximaSemana = despesasPendentes
    .filter(l => {
      const v = new Date(l.data_vencimento+"T00:00:00");
      return v > hojeDate && v <= em7dias;
    })
    .sort((a,b)=>a.data_vencimento.localeCompare(b.data_vencimento));

  // Previsão de despesa do cartão — olha os próximos 6 meses
  const todosProximosMeses = [1,2,3,4,5,6].map(offset=>{
    const ref = mesRefAtual(offset);
    const total = data.comprasCartao.filter(c=>c.mes_referencia===ref).reduce((s,c)=>s+c.valor_parcela,0);
    return { ref, total };
  });
  const proximosMeses = todosProximosMeses.filter(m => m.total > 0);

  return (
    <div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexWrap:"wrap", gap:12}}>
        <div>
          <h1>Dashboard — {mesLabel(mesFiltro)}</h1>
          <p className="subtitle">Visão consolidada: lançamentos diretos + cartão de crédito, tudo no mesmo lugar.</p>
        </div>
        <div style={{marginBottom:24}}>
          <label>Ver mês</label>
          <input type="month" value={mesFiltro} onChange={e=>setMesFiltro(e.target.value)} />
        </div>
      </div>

      <div className="metric-grid">
        <div className="metric">
          <div className="metric-label">Receitas do mês</div>
          <div className="metric-value" style={{color:"#3B6D11"}}>{fmtMoney(receitas)}</div>
        </div>
        <div className="metric">
          <div className="metric-label">Despesas do mês (direta + cartão)</div>
          <div className="metric-value" style={{color:"var(--wine)"}}>{fmtMoney(despesasTotal)}</div>
        </div>
        <div className="metric">
          <div className="metric-label">Saldo</div>
          <div className={`metric-value underline-double`} style={{color: saldo>=0 ? "#3B6D11" : "var(--wine)"}}>{fmtMoney(saldo)}</div>
        </div>
      </div>

      {(contasVencidas.length>0 || contasVenceHoje.length>0 || contasProximaSemana.length>0) && (
        <div className="card" style={{borderColor: (contasVencidas.length>0 || contasVenceHoje.length>0) ? "var(--wine)" : "var(--gold)", borderWidth:"1.5px"}}>
          <h2>Contas a pagar</h2>
          {contasVencidas.length>0 && (
            <div style={{marginBottom:14}}>
              <p className="helper" style={{color:"var(--wine)", fontWeight:600, marginBottom:6}}>Vencidas</p>
              {contasVencidas.map(l=>(
                <div className="ledger-row" key={l.id} style={{gridTemplateColumns:"1fr auto", background:"var(--wine-soft)", borderRadius:6, padding:"8px 10px", marginBottom:4}}>
                  <span style={{fontSize:13, color:"var(--wine)", fontWeight:500}}>{l.descricao} · venceu {l.data_vencimento.split("-").reverse().join("/")}</span>
                  <span className="money neg" style={{fontSize:13}}>{fmtMoney(l.valor)}</span>
                </div>
              ))}
            </div>
          )}
          {contasVenceHoje.length>0 && (
            <div style={{marginBottom:14}}>
              <p className="helper" style={{color:"var(--orange)", fontWeight:600, marginBottom:6}}>Vence hoje</p>
              {contasVenceHoje.map(l=>(
                <div className="ledger-row" key={l.id} style={{gridTemplateColumns:"1fr auto", background:"var(--orange-soft)", borderRadius:6, padding:"8px 10px", marginBottom:4}}>
                  <span style={{fontSize:13, color:"var(--orange)", fontWeight:500}}>{l.descricao}</span>
                  <span className="money neg" style={{fontSize:13}}>{fmtMoney(l.valor)}</span>
                </div>
              ))}
            </div>
          )}
          {contasProximaSemana.length>0 && (
            <div>
              <p className="helper" style={{fontWeight:600, marginBottom:6}}>Próximos 7 dias</p>
              {contasProximaSemana.map(l=>(
                <div className="ledger-row" key={l.id} style={{gridTemplateColumns:"1fr auto"}}>
                  <span style={{fontSize:13}}>{l.descricao} · vence {l.data_vencimento.split("-").reverse().join("/")}</span>
                  <span className="money neg" style={{fontSize:13}}>{fmtMoney(l.valor)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div style={{display:"flex", gap:16, flexWrap:"wrap"}}>
        <div className="card" style={{flex:1, minWidth:220}}>
          <h2 style={{textAlign:"center", fontSize:15}}>Gasto por categoria</h2>
          {dadosCategoria.length===0 && <div className="empty-state">Nenhuma despesa neste mês ainda.</div>}
          {dadosCategoria.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:10}}>
              <DonutChart data={dadosCategoria} size={115} selecionado={detalheCategoria} onSliceClick={(label)=>setDetalheCategoria(detalheCategoria===label ? null : label)} />
              {detalheCategoria && (itensPorCategoria[detalheCategoria]||[]).length>0 && (
                <div style={{width:"100%", marginTop:6, paddingTop:12, borderTop:"1px dashed var(--paper-line)"}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>Compõem "{detalheCategoria}":</p>
                  {itensPorCategoria[detalheCategoria].map((it,i)=>(
                    <div className="ledger-row" key={i} style={{gridTemplateColumns:"1fr auto"}}>
                      <span style={{fontSize:13}}>{it.descricao}{it.extra ? ` · ${it.extra}` : ""}</span>
                      <span className="money neg" style={{fontSize:13}}>{fmtMoney(it.valor)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="card" style={{flex:1, minWidth:220}}>
          <h2 style={{textAlign:"center", fontSize:15}}>Gasto no cartão por pessoa</h2>
          {dadosPessoa.length===0 && <div className="empty-state">Nenhuma compra de cartão neste mês.</div>}
          {dadosPessoa.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:10}}>
              <DonutChart data={dadosPessoa} size={115} selecionado={detalhePessoa} onSliceClick={(label)=>setDetalhePessoa(detalhePessoa===label ? null : label)} />
              {detalhePessoa && (itensPorPessoa[detalhePessoa]||[]).length>0 && (
                <div style={{width:"100%", marginTop:6, paddingTop:12, borderTop:"1px dashed var(--paper-line)"}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>Compras de "{detalhePessoa}":</p>
                  {itensPorPessoa[detalhePessoa].map((c,i)=>(
                    <div className="ledger-row" key={i} style={{gridTemplateColumns:"1fr auto"}}>
                      <span style={{fontSize:13}}>{c.descricao} · parcela {c.parcela_atual}/{c.parcela_total}</span>
                      <span className="money neg" style={{fontSize:13}}>{fmtMoney(c.valor_parcela)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {creditosMes < 0 && (
            <p className="helper" style={{marginTop:14, color:"#3B6D11", fontSize:12}}>
              + créditos: {fmtMoney(-creditosMes)}
            </p>
          )}
        </div>

        <div className="card" style={{flex:1, minWidth:220}}>
          <h2 style={{textAlign:"center", fontSize:15}}>Despesas por status</h2>
          {dadosStatus.length===0 && <div className="empty-state">Nenhuma despesa com vencimento/status neste mês.</div>}
          {dadosStatus.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:10}}>
              <DonutChart data={dadosStatus} size={115} selecionado={detalheStatus} onSliceClick={(label)=>setDetalheStatus(detalheStatus===label ? null : label)} />
              {detalheStatus && (itensPorStatus[detalheStatus]||[]).length>0 && (
                <div style={{width:"100%", marginTop:6, paddingTop:12, borderTop:"1px dashed var(--paper-line)"}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>Despesas "{detalheStatus}":</p>
                  {itensPorStatus[detalheStatus].map((l,i)=>(
                    <div className="ledger-row" key={i} style={{gridTemplateColumns:"1fr auto"}}>
                      <span style={{fontSize:13}}>{l.descricao} · {l.categoria}</span>
                      <span className="money neg" style={{fontSize:13}}>{fmtMoney(l.valor)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        <div className="card" style={{flex:1, minWidth:220}}>
          <h2 style={{textAlign:"center", fontSize:15}}>Receita por descrição</h2>
          {dadosReceita.length===0 && <div className="empty-state">Nenhuma receita neste mês ainda.</div>}
          {dadosReceita.length>0 && (
            <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:10}}>
              <DonutChart data={dadosReceita} size={115} selecionado={detalheReceita} onSliceClick={(label)=>setDetalheReceita(detalheReceita===label ? null : label)} />
              {detalheReceita && (itensPorReceita[detalheReceita]||[]).length>0 && (
                <div style={{width:"100%", marginTop:6, paddingTop:12, borderTop:"1px dashed var(--paper-line)"}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>Lançamentos de "{detalheReceita}":</p>
                  {itensPorReceita[detalheReceita].map((l,i)=>(
                    <div className="ledger-row" key={i} style={{gridTemplateColumns:"1fr auto"}}>
                      <span style={{fontSize:13}}>{l.categoria}{l.forma_pagamento ? ` · ${l.forma_pagamento}` : ""}</span>
                      <span className="money pos" style={{fontSize:13}}>+{fmtMoney(l.valor)}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>
      <p className="helper" style={{marginTop:-6, marginBottom:20}}>Passe o mouse numa fatia pra ver o nome e o valor. Clique pra ver o detalhamento.</p>

      <div className="card">
        <h2>Previsão de despesa do cartão — próximos meses</h2>
        <p className="helper" style={{marginBottom:14}}>Gerada automaticamente a partir das parcelas futuras já lançadas.</p>
        {todosProximosMeses.some(m=>m.total>0) && (
          <div style={{marginBottom:20, display:"flex", justifyContent:"center"}}>
            <LineChart data={todosProximosMeses.map(m=>({ label: mesLabel(m.ref), value: m.total }))} />
          </div>
        )}
        <p className="helper" style={{marginBottom:14}}>Clique num mês pra ver o detalhe.</p>
        {proximosMeses.length===0 && <div className="empty-state">Nenhuma despesa futura de cartão prevista nos próximos meses.</div>}
        {proximosMeses.map(m=>{
          const aberto = mesDetalhe === m.ref;
          const comprasDoMes = aberto
            ? data.comprasCartao.filter(c => c.mes_referencia === m.ref).sort((a,b) => b.valor_parcela - a.valor_parcela)
            : [];
          return (
            <React.Fragment key={m.ref}>
              <div
                className="ledger-row"
                style={{gridTemplateColumns:"1fr auto", cursor:"pointer", background: aberto ? "var(--paper)" : "transparent"}}
                onClick={()=>setMesDetalhe(aberto ? null : m.ref)}
              >
                <span style={{fontWeight: aberto ? 600 : 400}}>
                  {mesLabel(m.ref)} {aberto ? "▾" : "▸"}
                </span>
                <span className="money neg">{fmtMoney(m.total)}</span>
              </div>
              {aberto && (
                <div style={{marginBottom:14, paddingBottom:14, borderBottom:"1px dashed var(--paper-line)", background:"var(--paper)", padding:"10px 14px", borderRadius:8}}>
                  <p className="helper" style={{marginTop:0, marginBottom:8}}>
                    Compras previstas para {mesLabel(m.ref)}:
                  </p>
                  {comprasDoMes.length===0 && <div className="empty-state">Nenhuma compra prevista para esse mês.</div>}
                  {comprasDoMes.map(c=>(
                    <div className="ledger-row" key={c.id}>
                      <div className="stamp">{(c.responsavel||"?").slice(0,2).toUpperCase()}</div>
                      <div>
                        <div style={{fontWeight:500}}>{c.descricao}</div>
                        <div style={{fontSize:12,color:"var(--ink-soft)"}}>
                          parcela {c.parcela_atual}/{c.parcela_total} · {c.responsavel}
                        </div>
                      </div>
                      <span className={`money ${(-c.valor_parcela)<0 ? "neg" : "pos"}`}>
                        {(-c.valor_parcela)>=0 ? "+" : ""}{fmtMoney(-c.valor_parcela)}
                      </span>
                      <span></span>
                      <span></span>
                    </div>
                  ))}
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
